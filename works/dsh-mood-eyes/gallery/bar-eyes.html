<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#06070c" />
<title>BAR EYES · 双杠眼表情研究</title>
<style>
  *,
  *::before,
  *::after { box-sizing: border-box; }

  :root {
    --bg: #06070c;
    --ink: #f3f6ff;
    --muted: rgba(226, 233, 255, .55);
    --faint: rgba(226, 233, 255, .28);
    --line: rgba(255, 255, 255, .1);
    --glow: #c9d7ff;
    --glow-rgb: 201, 215, 255;
    --eye-w: clamp(36px, 3.5vw, 50px);
    --eye-h: calc(var(--eye-w) * 3);
    --eye-gap: clamp(38px, 5.2vw, 72px);
  }

  html { background: var(--bg); }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 62% 52% at 50% 38%, rgba(64, 88, 255, .13), transparent 64%),
      radial-gradient(ellipse 45% 42% at 8% 86%, rgba(0, 190, 255, .08), transparent 70%),
      radial-gradient(ellipse 38% 40% at 92% 12%, rgba(255, 70, 170, .06), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255, 255, 255, .075) .7px, transparent .8px);
    background-size: 24px 24px;
    -webkit-mask-image: radial-gradient(ellipse 65% 60% at 50% 42%, #000 0%, transparent 76%);
    mask-image: radial-gradient(ellipse 65% 60% at 50% 42%, #000 0%, transparent 76%);
    opacity: .5;
    pointer-events: none;
    z-index: 0;
  }

  ::selection { background: var(--glow); color: #07080e; }

  :focus-visible {
    outline: 2px solid var(--glow);
    outline-offset: 3px;
  }

  .ambient {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    will-change: transform;
  }

  .orb-a {
    width: 42vw;
    height: 42vw;
    left: -14vw;
    top: -8vh;
    background: #3145ff;
    opacity: .2;
    animation: drift-a 22s ease-in-out infinite alternate;
  }

  .orb-b {
    width: 34vw;
    height: 34vw;
    right: -10vw;
    bottom: -14vh;
    background: #00b7ff;
    opacity: .14;
    animation: drift-b 26s ease-in-out infinite alternate;
  }

  .orb-c {
    width: 22vw;
    height: 22vw;
    right: 18vw;
    top: 18vh;
    background: #ff4d9e;
    opacity: .08;
    animation: drift-c 19s ease-in-out infinite alternate;
  }

  @keyframes drift-a { to { transform: translate(7vw, 7vh) scale(1.08); } }
  @keyframes drift-b { to { transform: translate(-6vw, -5vh) scale(1.12); } }
  @keyframes drift-c { to { transform: translate(-4vw, 6vh) scale(.92); } }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1180px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: clamp(20px, 3vw, 40px) clamp(18px, 4vw, 46px) clamp(18px, 2.6vw, 30px);
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    gap: clamp(14px, 2.8vh, 30px);
  }

  .topbar,
  .stage,
  .controls { min-width: 0; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    min-height: 28px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 18px;
  }

  .brand-mark i {
    display: block;
    width: 3px;
    height: 15px;
    border-radius: 99px;
    background-color: var(--glow);
    box-shadow: 0 0 9px rgba(var(--glow-rgb), .8);
    transition: background-color .6s ease, box-shadow .6s ease;
  }

  .brand-mark i:last-child { height: 11px; opacity: .65; }

  .brand-name {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .24em;
    color: rgba(244, 247, 255, .9);
  }

  .brand-divider {
    width: 1px;
    height: 10px;
    background: var(--line);
  }

  .brand-sub {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 10px;
    line-height: 1;
    letter-spacing: .18em;
    color: var(--faint);
    white-space: nowrap;
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--faint);
    white-space: nowrap;
  }

  .hint-sep {
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: var(--faint);
  }

  kbd {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 10px;
    line-height: 1;
    color: var(--muted);
    border: 1px solid var(--line);
    border-bottom-color: rgba(255, 255, 255, .18);
    border-radius: 5px;
    padding: 3px 6px;
    background: rgba(255, 255, 255, .03);
  }

  .stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 3.2vh, 34px);
    min-height: 0;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 24px;
    opacity: 0;
    animation: fade-up .8s .25s cubic-bezier(.16, 1, .3, 1) forwards;
  }

  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background-color: var(--glow);
    box-shadow: 0 0 12px rgba(var(--glow-rgb), .9);
    transition: background-color .6s ease, box-shadow .6s ease;
  }

  .status-cn {
    font-size: 14px;
    letter-spacing: .2em;
    color: rgba(244, 247, 255, .92);
  }

  .status-en {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 10px;
    line-height: 1;
    letter-spacing: .22em;
    color: var(--faint);
    border-left: 1px solid var(--line);
    padding-left: 10px;
  }

  .status-index {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 10px;
    line-height: 1;
    letter-spacing: .12em;
    color: rgba(255, 255, 255, .2);
  }

  .status.is-changing .status-cn,
  .status.is-changing .status-en,
  .status.is-changing .status-index,
  .status.is-changing .status-dot {
    animation: status-swap .5s cubic-bezier(.16, 1, .3, 1) both;
  }

  .status.is-changing .status-en { animation-delay: .03s; }
  .status.is-changing .status-index { animation-delay: .06s; }

  @keyframes status-swap {
    0% { opacity: 0; transform: translateY(6px); filter: blur(5px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .face-wrap {
    position: relative;
    display: grid;
    place-items: center;
    padding: clamp(24px, 4vh, 40px) clamp(28px, 5vw, 70px) clamp(36px, 6vh, 58px);
    perspective: 900px;
    perspective-origin: 50% 50%;
    animation: intro 1.1s cubic-bezier(.16, 1, .3, 1) both;
  }

  @keyframes intro {
    0% { opacity: 0; transform: translateY(14px) scale(.94); filter: blur(10px); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .halo {
    position: absolute;
    width: clamp(260px, 38vw, 450px);
    aspect-ratio: 1;
    border-radius: 50%;
    background-color: rgb(var(--glow-rgb));
    filter: blur(90px);
    opacity: .13;
    transition: background-color .8s ease, opacity .8s ease;
    animation: halo-breathe 7s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes halo-breathe {
    0%, 100% { transform: scale(.92); opacity: .1; }
    50% { transform: scale(1.06); opacity: .16; }
  }

  .orbit-wrap {
    position: absolute;
    width: clamp(280px, 36vw, 430px);
    aspect-ratio: 1;
    border-radius: 50%;
    opacity: .75;
    pointer-events: none;
  }

  .orbit-ring {
    position: absolute;
    inset: 0;
    border: 1px solid rgba(255, 255, 255, .055);
    border-radius: 50%;
  }

  .orbit-spinner {
    position: absolute;
    inset: 0;
    animation: orbit-spin 26s linear infinite;
  }

  .orbit-dot {
    position: absolute;
    top: -2.5px;
    left: 50%;
    width: 5px;
    height: 5px;
    margin-left: -2.5px;
    border-radius: 50%;
    background-color: var(--glow);
    box-shadow: 0 0 12px rgba(var(--glow-rgb), .9);
    transition: background-color .6s ease, box-shadow .6s ease;
  }

  @keyframes orbit-spin { to { transform: rotate(360deg); } }

  .face {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--eye-gap);
    transform-origin: 50% 50%;
    will-change: transform;
  }

  .eye {
    position: relative;
    width: var(--eye-w);
    height: var(--eye-h);
    border-radius: 999px;
    background:
      linear-gradient(90deg, rgba(255, 255, 255, .22) 0%, rgba(255, 255, 255, 0) 26%, rgba(255, 255, 255, 0) 72%, rgba(255, 255, 255, .14) 100%),
      linear-gradient(180deg, #ffffff 0%, #fbfcff 28%, #edf2ff 60%, #ccd8f8 86%, #b9c8ef 100%);
    box-shadow:
      inset 0 -12px 20px rgba(64, 86, 156, .2),
      inset 3px 0 8px rgba(255, 255, 255, .65),
      inset -3px 0 8px rgba(74, 94, 164, .14),
      0 0 26px rgba(var(--glow-rgb), .42),
      0 0 90px rgba(var(--glow-rgb), .16);
    transform-origin: 50% 50%;
    will-change: transform;
    cursor: pointer;
    transition: box-shadow .8s ease;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .eye::before {
    content: "";
    position: absolute;
    left: 19%;
    top: 6%;
    width: 30%;
    height: 32%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .98) 0%, rgba(255, 255, 255, .55) 38%, rgba(255, 255, 255, 0) 100%);
    filter: blur(.3px);
    pointer-events: none;
  }

  .eye::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 5%;
    width: 54%;
    height: 14%;
    transform: translateX(-50%);
    border-radius: 999px;
    background: radial-gradient(ellipse at center, rgba(109, 139, 218, .32), transparent 72%);
    filter: blur(2px);
    pointer-events: none;
  }

  .glasses {
    position: absolute;
    inset: 0;
    z-index: 3;
    opacity: 0;
    transform: translateY(-20px) scale(.96);
    transition: opacity .3s ease, transform .4s ease;
    pointer-events: none;
  }

  .face.is-focus .glasses {
    opacity: 1;
    transform: translateY(0) scale(1);
    animation: glasses-on .9s cubic-bezier(.16, 1, .3, 1) both;
  }

  .glasses-follow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--eye-gap);
    width: 100%;
    height: 100%;
    transform: translate3d(var(--glasses-x, 0px), var(--glasses-y, 0px), 0);
    transition: transform .14s ease-out;
  }

  @keyframes glasses-on {
    0% { opacity: 0; transform: translateY(-110px) rotateX(28deg) scale(.9); }
    55% { opacity: 1; transform: translateY(8px) rotateX(-5deg) scale(1.02); }
    76% { transform: translateY(-3px) rotateX(1.5deg) scale(1); }
    100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); }
  }

  .lens {
    position: relative;
    flex: 0 0 auto;
    width: calc(var(--eye-w) + 28px);
    height: calc(var(--eye-h) + 18px);
    margin: 0 -14px;
    border: 1.5px solid rgba(205, 234, 255, .62);
    border-radius: 28px;
    background: linear-gradient(140deg, rgba(130, 195, 255, .09), rgba(255, 255, 255, .015) 55%, rgba(130, 195, 255, .05));
    box-shadow:
      inset 0 0 24px rgba(125, 195, 255, .1),
      0 0 24px rgba(140, 205, 255, .12);
  }

  .lens::before {
    content: "";
    position: absolute;
    left: 14%;
    top: 8%;
    width: 22%;
    height: 42%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, 0));
    filter: blur(.4px);
    opacity: .55;
    transform: rotate(14deg);
    transform-origin: center;
  }

  .face.is-focus .lens::before {
    animation: lens-glint 1.2s .35s cubic-bezier(.16, 1, .3, 1) both;
  }

  @keyframes lens-glint {
    0% { opacity: 0; transform: translate(-6px, -4px) rotate(14deg) scaleY(.6); }
    35% { opacity: .8; }
    100% { opacity: .45; transform: translate(7px, 6px) rotate(14deg) scaleY(1.15); }
  }

  .lens-l::after,
  .lens-r::after {
    content: "";
    position: absolute;
    top: 38%;
    width: clamp(26px, 3.2vw, 42px);
    height: 2px;
    border-radius: 99px;
    background: linear-gradient(90deg, rgba(205, 234, 255, .05), rgba(205, 234, 255, .6));
  }

  .lens-l::after {
    right: 100%;
    transform: rotate(-7deg);
    transform-origin: right center;
  }

  .lens-r::after {
    left: 100%;
    background: linear-gradient(90deg, rgba(205, 234, 255, .6), rgba(205, 234, 255, .05));
    transform: rotate(7deg);
    transform-origin: left center;
  }

  .bridge {
    position: absolute;
    left: 50%;
    top: 41%;
    width: calc(var(--eye-gap) - 28px);
    height: 2px;
    transform: translateX(-50%);
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, rgba(205, 234, 255, .75), transparent);
    box-shadow: 0 0 8px rgba(150, 210, 255, .3);
  }

  .anger-mark {
    position: absolute;
    left: 50%;
    top: calc(50% - var(--eye-h) / 2 - clamp(42px, 6vh, 62px));
    transform: translate(-50%, -50%) scale(.9);
    font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    font-size: clamp(26px, 3.6vw, 46px);
    line-height: 1;
    opacity: 0;
    pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(255, 80, 70, .85));
    transition: opacity .2s ease;
  }

  .face.is-angry .anger-mark {
    opacity: 1;
    animation: anger-throb .5s ease-in-out infinite alternate;
  }

  @keyframes anger-throb {
    from { transform: translate(-50%, -50%) scale(.84) rotate(-4deg); }
    to { transform: translate(-50%, -50%) scale(1.12) rotate(4deg); }
  }

  .floor-glow {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 3vh, 30px);
    width: clamp(140px, 24vw, 230px);
    height: 10px;
    transform: translateX(-50%);
    border-radius: 50%;
    background-color: rgb(var(--glow-rgb));
    filter: blur(18px);
    opacity: .14;
    pointer-events: none;
    z-index: 0;
    transition: background-color .8s ease;
  }

  .floor-shadow {
    position: absolute;
    left: 50%;
    bottom: clamp(10px, 2vh, 18px);
    width: clamp(170px, 28vw, 270px);
    height: 18px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, .85), rgba(0, 0, 0, .25) 48%, transparent 72%);
    filter: blur(9px);
    opacity: .8;
    pointer-events: none;
    z-index: 0;
  }

  .controls {
    width: min(100%, 980px);
    min-width: 0;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: fade-up .8s .45s cubic-bezier(.16, 1, .3, 1) both;
  }

  @keyframes fade-up {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .chips {
    display: flex;
    flex-wrap: nowrap;
    gap: 7px;
    width: 100%;
    min-width: 0;
    overflow-x: auto;
    padding: 3px 2px 8px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
  }

  .chips::-webkit-scrollbar { display: none; }

  .chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    border: 1px solid var(--line);
    background-color: rgba(255, 255, 255, .025);
    color: rgba(226, 233, 255, .62);
    border-radius: 999px;
    padding: 9px 14px;
    font-family: inherit;
    font-size: 12.5px;
    letter-spacing: .08em;
    white-space: nowrap;
    cursor: pointer;
    transition: color .22s ease, background-color .22s ease, border-color .22s ease, transform .22s ease, box-shadow .22s ease;
  }

  .chip:hover {
    color: rgba(255, 255, 255, .95);
    border-color: rgba(255, 255, 255, .26);
    background-color: rgba(255, 255, 255, .055);
    transform: translateY(-1px);
  }

  .chip:active { transform: translateY(0) scale(.98); }

  .chip-en {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 8.5px;
    line-height: 1;
    letter-spacing: .14em;
    opacity: .45;
  }

  .chip.active {
    color: #0a0c14;
    background-color: var(--glow);
    border-color: transparent;
    box-shadow: 0 0 26px rgba(var(--glow-rgb), .32);
    font-weight: 600;
  }

  .chip.active .chip-en { opacity: .62; }

  .controls-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border-top: 1px solid var(--line);
    padding-top: 13px;
  }

  .auto-toggle {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border: 0;
    background: none;
    padding: 0;
    color: var(--faint);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 11px;
    line-height: 1;
    letter-spacing: .16em;
    cursor: pointer;
    transition: color .25s ease;
  }

  .auto-toggle:hover { color: var(--muted); }
  .auto-toggle[aria-pressed="true"] { color: rgba(244, 247, 255, .85); }

  .switch {
    position: relative;
    width: 34px;
    height: 18px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .12);
    background-color: rgba(255, 255, 255, .06);
    transition: background-color .3s ease, border-color .3s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, .45);
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), background-color .3s ease, box-shadow .3s ease;
  }

  .auto-toggle[aria-pressed="true"] .switch {
    border-color: rgba(var(--glow-rgb), .5);
    background-color: rgba(var(--glow-rgb), .18);
  }

  .auto-toggle[aria-pressed="true"] .switch::after {
    transform: translateX(16px);
    background-color: var(--glow);
    box-shadow: 0 0 12px rgba(var(--glow-rgb), .8);
  }

  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn {
    border: 1px solid var(--line);
    background-color: rgba(255, 255, 255, .025);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: .14em;
    cursor: pointer;
    transition: color .24s ease, border-color .24s ease, background-color .24s ease, transform .24s ease;
  }

  .icon-btn:hover {
    color: #fff;
    border-color: rgba(255, 255, 255, .3);
    background-color: rgba(255, 255, 255, .06);
    transform: translateY(-1px);
  }

  .icon-btn:active { transform: translateY(0) scale(.98); }

  .spark {
    position: absolute;
    z-index: 6;
    border-radius: 999px;
    background-color: rgb(var(--glow-rgb));
    box-shadow: 0 0 8px rgba(var(--glow-rgb), .9);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: spark-fly .8s cubic-bezier(.16, 1, .3, 1) forwards;
  }

  @keyframes spark-fly {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(0deg); }
    12% { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.1) rotate(var(--rot)); }
  }

  .fx {
    position: absolute;
    inset: 0;
    z-index: 3;
    overflow: visible;
    pointer-events: none;
  }

  .fx-item {
    --x: 0px;
    --y: 0px;
    --dx: 0px;
    --dy: 0px;
    --rise: 0px;
    --fall: 0px;
    --rot: 0deg;
    --spin: 0deg;
    --alpha: 1;
    position: absolute;
    left: 50%;
    top: 50%;
    display: block;
    width: var(--size, 12px);
    height: var(--size, 12px);
    color: var(--glow);
    pointer-events: none;
    will-change: transform, opacity;
    transform: translate(-50%, -50%);
  }

  .fx-item svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fx-heart {
    filter: drop-shadow(0 0 6px rgba(var(--glow-rgb), .55));
    animation: fx-rise var(--dur, 1.8s) cubic-bezier(.16, 1, .3, 1) forwards;
  }

  .fx-heart svg { fill: currentColor; }

  .fx-star {
    filter: drop-shadow(0 0 6px rgba(var(--glow-rgb), .7));
    animation: fx-pop var(--dur, .9s) cubic-bezier(.16, 1, .3, 1) forwards;
  }

  .fx-star svg { fill: currentColor; }

  .fx-z,
  .fx-question {
    width: auto;
    height: auto;
    font-weight: 600;
    line-height: 1;
    text-shadow: 0 0 8px rgba(var(--glow-rgb), .7);
    animation: fx-rise var(--dur, 1.8s) cubic-bezier(.16, 1, .3, 1) forwards;
  }

  .fx-z {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: var(--size, 16px);
  }

  .fx-question {
    font-family: Georgia, "Times New Roman", serif;
    font-size: var(--size, 20px);
  }

  .fx-tear {
    width: var(--w, 4px);
    height: var(--h, 10px);
    border-radius: 999px;
    background-color: rgb(var(--glow-rgb));
    box-shadow: 0 0 7px rgba(var(--glow-rgb), .8);
    animation: fx-fall var(--dur, 1.3s) cubic-bezier(.3, .1, .5, 1) forwards;
  }

  .fx-spiral {
    filter: drop-shadow(0 0 5px rgba(var(--glow-rgb), .7));
    animation: fx-swirl var(--dur, 1.6s) cubic-bezier(.2, .7, .2, 1) forwards;
  }

  .fx-spiral path { stroke: currentColor; }

  .fx-line {
    width: 3px;
    height: var(--h, 14px);
    border-radius: 99px;
    background-color: currentColor;
    box-shadow: 0 0 6px rgba(var(--glow-rgb), .7);
    animation: fx-line-burst var(--dur, .7s) ease-out forwards;
  }

  @keyframes fx-rise {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(.2) rotate(var(--rot)); }
    12% { opacity: var(--alpha); }
    65% { opacity: var(--alpha); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(calc(var(--x) + var(--dx)), calc(var(--y) - var(--rise))) scale(1.05) rotate(calc(var(--rot) + var(--spin))); }
  }

  @keyframes fx-fall {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(.4); }
    12% { opacity: var(--alpha); }
    70% { opacity: var(--alpha); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--fall))) scale(.9); }
  }

  @keyframes fx-swirl {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(.3) rotate(0deg); }
    15% { opacity: var(--alpha); }
    65% { opacity: var(--alpha); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) scale(1.15) rotate(var(--spin)); }
  }

  @keyframes fx-pop {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(.1) rotate(0deg); }
    25% { opacity: var(--alpha); }
    70% { opacity: var(--alpha); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) scale(1.25) rotate(var(--spin)); }
  }

  @keyframes fx-line-burst {
    0% { opacity: 0; transform: translate(-50%, -50%) translate(var(--x), var(--y)) rotate(var(--rot)) scaleY(.2); }
    18% { opacity: var(--alpha); }
    62% { opacity: var(--alpha); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(calc(var(--x) + var(--dx)), calc(var(--y) + var(--dy))) rotate(var(--rot)) scaleY(1); }
  }

  @media (min-width: 820px) {
    .chips {
      flex-wrap: wrap;
      justify-content: center;
      overflow: visible;
      padding-bottom: 2px;
      -webkit-mask-image: none;
      mask-image: none;
    }
  }

  @media (max-width: 720px) {
    .brand-divider,
    .brand-sub { display: none; }
    .hint { display: none; }
    .app {
      gap: 10px;
      padding-top: 18px;
      padding-bottom: 16px;
    }
    .stage { gap: 12px; }
    .status-index { display: none; }
    .face-wrap { padding: 20px 20px 34px; }
    .floor-shadow { bottom: 6px; }
    .controls-bottom { padding-top: 11px; }
  }

  @media (max-width: 640px) {
    .chip-en { display: none; }
    .chip { padding: 9px 13px; }
  }

  @media (max-height: 700px) and (min-width: 721px) {
    :root {
      --eye-w: clamp(28px, 2.8vw, 38px);
      --eye-h: calc(var(--eye-w) * 3.1);
      --eye-gap: clamp(30px, 4.4vw, 56px);
    }
    .face-wrap { padding-top: 8px; padding-bottom: 28px; }
    .stage { gap: 8px; }
    .status { height: 20px; }
    .controls { gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb,
    .halo,
    .orbit-spinner { animation: none !important; }
    .face-wrap,
    .status,
    .controls { animation-duration: .01ms !important; animation-delay: 0ms !important; }
  }

  /* Static poster mode: /bar-eyes.html?still=1 */
  body.is-capture *,
  body.is-capture *::before,
  body.is-capture *::after { animation: none !important; }

  body.is-capture .status,
  body.is-capture .face-wrap,
  body.is-capture .controls {
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }

  body.is-capture .fx { display: none !important; }

  body.is-capture .glasses { transition: none !important; }

  body.is-capture .face.is-focus .glasses {
    opacity: 1 !important;
    transform: none !important;
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
  </div>

  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span class="brand-name">BAR EYES</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-sub">表情研究 / 001</span>
      </div>
      <div class="hint">
        <span>移动鼠标 · 点击眼睛</span>
        <span class="hint-sep" aria-hidden="true"></span>
        <kbd>空格</kbd>
        <span>眨眼</span>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="双眼表情舞台">
      <div class="status" id="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-cn" id="statusCn">平静</span>
        <span class="status-en" id="statusEn">NEUTRAL</span>
        <span class="status-index" id="statusIndex">01 / 13</span>
      </div>

      <div class="face-wrap">
        <div class="halo" aria-hidden="true"></div>
        <div class="orbit-wrap" aria-hidden="true">
          <div class="orbit-ring"></div>
          <div class="orbit-spinner"><span class="orbit-dot"></span></div>
        </div>
        <div class="face" id="face" aria-hidden="true">
          <div class="eye" id="eyeL"></div>
          <div class="eye" id="eyeR"></div>
          <div class="glasses" aria-hidden="true">
            <div class="glasses-follow">
              <span class="lens lens-l"></span>
              <span class="lens lens-r"></span>
              <span class="bridge"></span>
            </div>
          </div>
          <div class="anger-mark" aria-hidden="true">💢</div>
        </div>
        <div class="fx" id="fx" aria-hidden="true"></div>
        <div class="floor-glow" aria-hidden="true"></div>
        <div class="floor-shadow" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="controls">
      <div class="chips" id="chips" role="group" aria-label="选择表情"></div>
      <div class="controls-bottom">
        <button class="auto-toggle" id="autoBtn" type="button" aria-pressed="true">
          <span class="switch" aria-hidden="true"></span>
          <span>自动巡演</span>
        </button>
        <div class="actions">
          <button class="icon-btn" id="blinkBtn" type="button">眨眼</button>
          <button class="icon-btn" id="randomBtn" type="button">随机</button>
        </div>
      </div>
    </footer>
  </main>

<script>
(() => {
  'use strict';

  const root = document.documentElement;
  const stageEl = document.getElementById('stage');
  const faceEl = document.getElementById('face');
  const fxEl = document.getElementById('fx');
  const glassesFollowEl = document.querySelector('.glasses-follow');
  const statusEl = document.getElementById('status');
  const statusCn = document.getElementById('statusCn');
  const statusEn = document.getElementById('statusEn');
  const statusIndex = document.getElementById('statusIndex');
  const chipsEl = document.getElementById('chips');
  const autoBtn = document.getElementById('autoBtn');
  const blinkBtn = document.getElementById('blinkBtn');
  const randomBtn = document.getElementById('randomBtn');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const motionScale = reduceMotion ? 0.35 : 1;

  const MOODS = {
    neutral: {
      cn: '平静', en: 'NEUTRAL', glow: '#c9d7ff', tilt: 0, lean: 0, turn: 0, hold: 2.6,
      eyes: [
        { x: -1, y: 0, rot: -1.5, sx: 1, sy: 1 },
        { x: 1, y: 0, rot: 1.5, sx: 1.03, sy: 1 }
      ]
    },
    happy: {
      cn: '开心', en: 'HAPPY', glow: '#ffd98a', tilt: -5, lean: -10, turn: -6, hold: 3.6,
      eyes: [
        { x: -3, y: -8, rot: -20, sx: 1.05, sy: 0.4 },
        { x: 3, y: -8, rot: 20, sx: 1.11, sy: 0.4 }
      ]
    },
    curious: {
      cn: '好奇', en: 'CURIOUS', glow: '#9bffd9', tilt: 8, lean: 16, turn: 10, hold: 3.6,
      eyes: [
        { x: -2, y: -8, rot: -8, sx: 0.99, sy: 1.08 },
        { x: 2, y: 2, rot: 6, sx: 1.1, sy: 0.82 }
      ]
    },
    focus: {
      cn: '认真', en: 'FOCUSED', glow: '#bfe4ff', tilt: 2, lean: 8, turn: 5, hold: 3.8,
      eyes: [
        { x: -1, y: 1, rot: -2, sx: 1, sy: 0.9 },
        { x: 1, y: 1, rot: 2, sx: 1.04, sy: 0.9 }
      ]
    },
    surprised: {
      cn: '惊讶', en: 'SURPRISED', glow: '#a9f3ff', tilt: -2, lean: -6, turn: -4, hold: 3.0,
      eyes: [
        { x: -3, y: -9, rot: -3, sx: 0.88, sy: 1.18 },
        { x: 3, y: -9, rot: 3, sx: 0.94, sy: 1.18 }
      ]
    },
    sad: {
      cn: '难过', en: 'SAD', glow: '#8fb8ff', tilt: -8, lean: -16, turn: -9, hold: 3.6,
      eyes: [
        { x: -2, y: 10, rot: 13, sx: 1.07, sy: 0.72 },
        { x: 2, y: 10, rot: -13, sx: 0.99, sy: 0.72 }
      ]
    },
    sleepy: {
      cn: '困倦', en: 'SLEEPY', glow: '#aaa7ff', tilt: 5, lean: 14, turn: 7, hold: 3.6,
      eyes: [
        { x: 0, y: 6, rot: 7, sx: 1.12, sy: 0.7 },
        { x: 0, y: 6, rot: -7, sx: 1.03, sy: 0.76 }
      ]
    },
    angry: {
      cn: '生气', en: 'ANGRY', glow: '#ff8a80', tilt: -6, lean: -14, turn: -8, hold: 3.0,
      eyes: [
        { x: -2, y: -4, rot: -22, sx: 1.16, sy: 0.64 },
        { x: 2, y: -4, rot: 22, sx: 1.06, sy: 0.64 }
      ]
    },
    wink: {
      cn: '眨眼', en: 'WINK', glow: '#ffb8d9', tilt: 5, lean: 13, turn: 8, hold: 2.6,
      eyes: [
        { x: -1, y: 0, rot: -5, sx: 1.02, sy: 0.88 },
        { x: 1, y: 0, rot: 8, sx: 1.16, sy: 1 }
      ]
    },
    love: {
      cn: '心动', en: 'IN LOVE', glow: '#ff8fbe', tilt: -4, lean: -10, turn: -6, hold: 3.4,
      eyes: [
        { x: -3, y: -5, rot: 12, sx: 1.2, sy: 0.78 },
        { x: 3, y: -5, rot: -12, sx: 1.12, sy: 0.78 }
      ]
    },
    confused: {
      cn: '困惑', en: 'CONFUSED', glow: '#c8a7ff', tilt: 6, lean: 15, turn: 9, hold: 3.4,
      eyes: [
        { x: -3, y: -5, rot: 16, sx: 0.98, sy: 0.9 },
        { x: 3, y: 2, rot: -12, sx: 1.12, sy: 0.64 }
      ]
    },
    excited: {
      cn: '兴奋', en: 'EXCITED', glow: '#ffdf6b', tilt: 2, lean: 6, turn: 3, hold: 3.2,
      eyes: [
        { x: -4, y: -10, rot: -10, sx: 1.12, sy: 0.58 },
        { x: 4, y: -10, rot: 10, sx: 1.2, sy: 0.58 }
      ]
    },
    dizzy: {
      cn: '眩晕', en: 'DIZZY', glow: '#b98cff', tilt: 0, lean: 0, turn: 0, hold: 3.6,
      eyes: [
        { x: -4, y: 0, rot: 0, sx: 0.8, sy: 0.66 },
        { x: 4, y: 0, rot: 0, sx: 0.86, sy: 0.68 }
      ]
    }
  };

  const ORDER = ['neutral', 'happy', 'curious', 'focus', 'surprised', 'sad', 'sleepy', 'angry', 'wink', 'love', 'confused', 'excited', 'dizzy'];

  const eyeEls = [document.getElementById('eyeL'), document.getElementById('eyeR')];
  const eyes = eyeEls.map((el, index) => ({
    el,
    index,
    side: index === 0 ? -1 : 1,
    cur: { x: 0, y: 0, rot: 0, sx: 1, sy: 1 },
    vel: { x: 0, y: 0, rot: 0, sx: 0, sy: 0 },
    target: { x: 0, y: 0, rot: 0, sx: 1, sy: 1 },
    lid: 0,
    lidTarget: 0,
    wink: false,
    blinkCloseTimer: 0,
    blinkOpenTimer: 0
  }));

  const face = {
    cur: { x: 0, rot: 0, turn: 0, y: 0, scale: 1 },
    vel: { x: 0, rot: 0, turn: 0, y: 0, scale: 0 },
    target: { x: 0, rot: 0, turn: 0, y: 0, scale: 1 }
  };

  const state = {
    time: 0,
    last: 0,
    mood: null,
    moodStart: 0,
    auto: !reduceMotion,
    autoNext: 0,
    pointerInside: false,
    pointerX: 0,
    pointerY: 0,
    gazeX: 0,
    gazeY: 0,
    gazeTargetX: 0,
    gazeTargetY: 0,
    nextGazeAt: 0,
    pop: 0,
    nextBlink: 0,
    fxNext: 0,
    winkTimer: 0
  };

  const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
  const rand = (min, max) => min + Math.random() * (max - min);

  const EYE_SPRING = {
    x: { k: 170, d: 18 },
    y: { k: 180, d: 19 },
    rot: { k: 230, d: 22 },
    sx: { k: 200, d: 20 },
    sy: { k: 210, d: 20 }
  };

  const FACE_SPRING = {
    x: { k: 120, d: 15 },
    rot: { k: 120, d: 15 },
    turn: { k: 100, d: 14 },
    y: { k: 120, d: 15 },
    scale: { k: 120, d: 15 }
  };

  function applyGlow(hex) {
    root.style.setProperty('--glow', hex);
    const value = parseInt(hex.slice(1), 16);
    const r = (value >> 16) & 255;
    const g = (value >> 8) & 255;
    const b = value & 255;
    root.style.setProperty('--glow-rgb', `${r}, ${g}, ${b}`);
  }

  ORDER.forEach((id) => {
    const mood = MOODS[id];
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'chip';
    button.dataset.mood = id;
    button.setAttribute('aria-pressed', 'false');
    button.innerHTML = `<span class="chip-cn">${mood.cn}</span><span class="chip-en">${mood.en}</span>`;
    chipsEl.appendChild(button);
  });

  function syncChips() {
    chipsEl.querySelectorAll('.chip').forEach((chip) => {
      const active = chip.dataset.mood === state.mood;
      chip.classList.toggle('active', active);
      chip.setAttribute('aria-pressed', String(active));
    });
  }

  function syncAutoButton() {
    autoBtn.setAttribute('aria-pressed', String(state.auto));
  }

  function setAuto(on) {
    state.auto = on;
    syncAutoButton();
    if (on) {
      state.autoNext = state.time + 1.8;
    }
  }

  function clearBlinkTimers(eye) {
    window.clearTimeout(eye.blinkCloseTimer);
    window.clearTimeout(eye.blinkOpenTimer);
    eye.blinkCloseTimer = 0;
    eye.blinkOpenTimer = 0;
  }

  function blinkEye(eye, delay = 0) {
    if (eye.wink) return;
    clearBlinkTimers(eye);
    if (eye.lid < 0.15) eye.lidTarget = 0;
    eye.blinkCloseTimer = window.setTimeout(() => {
      if (eye.wink) return;
      eye.lidTarget = 1;
      eye.blinkOpenTimer = window.setTimeout(() => {
        eye.lidTarget = 0;
      }, 82);
    }, delay);
  }

  function blink() {
    blinkEye(eyes[0], 0);
    blinkEye(eyes[1], 16);
  }

  function winkEye(eye, hold = 260) {
    clearBlinkTimers(eye);
    eye.lidTarget = 1;
    eye.blinkOpenTimer = window.setTimeout(() => {
      eye.lidTarget = 0;
    }, hold);
  }

  function scheduleWink() {
    if (state.mood !== 'wink') return;
    winkEye(eyes[1], 260);
    state.winkTimer = window.setTimeout(scheduleWink, rand(2300, 3300));
  }

  function setMood(name, options = {}) {
    const mood = MOODS[name];
    if (!mood) return;

    if (state.mood === name && !options.init) {
      state.pop = Math.max(state.pop, 0.9);
      startEffects(name);
      blink();
      return;
    }

    const previousMood = state.mood;
    state.mood = name;
    state.moodStart = state.time;
    state.pop = Math.max(state.pop, options.init ? 0.5 : 1.15);

    applyGlow(mood.glow);
    statusCn.textContent = mood.cn;
    statusEn.textContent = mood.en;
    const orderIndex = ORDER.indexOf(name);
    statusIndex.textContent = `${String(orderIndex + 1).padStart(2, '0')} / ${String(ORDER.length).padStart(2, '0')}`;

    statusEl.classList.remove('is-changing');
    void statusEl.offsetWidth;
    statusEl.classList.add('is-changing');

    syncChips();
    faceEl.classList.toggle('is-focus', name === 'focus');
    faceEl.classList.toggle('is-angry', name === 'angry');
    startEffects(name);

    face.target.x = mood.lean || 0;
    face.target.rot = mood.tilt || 0;
    face.target.turn = mood.turn || 0;
    face.target.y = 0;
    face.target.scale = 1;

    if (previousMood === 'wink' && name !== 'wink') {
      window.clearTimeout(state.winkTimer);
      state.winkTimer = 0;
      clearBlinkTimers(eyes[1]);
      eyes[1].lidTarget = 0;
    }

    if (name === 'wink') {
      window.clearTimeout(state.winkTimer);
      state.winkTimer = 0;
      clearBlinkTimers(eyes[1]);
      eyes[0].wink = false;
      eyes[1].wink = false;
      if (document.body.classList.contains('is-capture')) {
        eyes[1].lidTarget = 1;
      } else {
        eyes[1].lidTarget = 0;
        state.winkTimer = window.setTimeout(scheduleWink, 180);
      }
    }

    if (!options.auto && !options.init) {
      state.auto = false;
      syncAutoButton();
    }

    if (options.auto) {
      state.autoNext = state.time + (mood.hold || 3.2);
    } else if (options.init) {
      state.autoNext = state.time + 2.2;
    }
  }

  function pickRandomMood() {
    let next = state.mood;
    while (next === state.mood) {
      next = ORDER[Math.floor(Math.random() * ORDER.length)];
    }
    setMood(next);
  }

  function updateAuto() {
    if (!state.auto || !state.mood) return;
    if (state.time >= state.autoNext) {
      const currentIndex = ORDER.indexOf(state.mood);
      const nextMood = ORDER[(currentIndex + 1) % ORDER.length];
      setMood(nextMood, { auto: true });
    }
  }

  function updateBlinkScheduler() {
    if (!state.mood) return;
    if (state.time < state.nextBlink) return;

    blink();
    let gap = rand(2.4, 5.2);
    if (state.mood === 'sleepy') gap = rand(2.8, 4.8);
    if (state.mood === 'surprised') gap = rand(3.8, 6.8);
    if (state.mood === 'love') gap = rand(2.2, 4);
    state.nextBlink = state.time + gap;

    if (Math.random() < 0.16) {
      window.setTimeout(blink, 210);
    }
  }

  function updateGaze(dt) {
    if (state.time >= state.nextGazeAt) {
      if (Math.random() < 0.18) {
        state.gazeTargetX = 0;
        state.gazeTargetY = 0;
      } else {
        state.gazeTargetX = rand(-14, 14);
        state.gazeTargetY = rand(-8, 8);
      }
      state.nextGazeAt = state.time + rand(0.9, 2.2);
      if (Math.random() < 0.25) {
        state.nextGazeAt = state.time + rand(0.12, 0.3);
      }
    }
    const follow = 1 - Math.exp(-dt * 20);
    state.gazeX += (state.gazeTargetX - state.gazeX) * follow;
    state.gazeY += (state.gazeTargetY - state.gazeY) * follow;
  }

  function updateTargets() {
    if (!state.mood) return;
    const mood = MOODS[state.mood];
    const pointerX = state.pointerInside ? state.pointerX : 0;
    const pointerY = state.pointerInside ? state.pointerY : 0;
    const lookX = (state.gazeX + pointerX * 4) * motionScale;
    const lookY = (state.gazeY + pointerY * 3) * motionScale;

    eyes.forEach((eye, index) => {
      const base = mood.eyes[index];
      eye.target.x = base.x + lookX;
      eye.target.y = base.y + lookY;
      eye.target.rot = base.rot;
      eye.target.sx = base.sx;
      eye.target.sy = base.sy;
    });

    if (glassesFollowEl) {
      const glassesX = pointerX * 8 + state.gazeX * 0.35;
      const glassesY = pointerY * 7 + state.gazeY * 0.35;
      glassesFollowEl.style.setProperty('--glasses-x', `${(glassesX * motionScale).toFixed(2)}px`);
      glassesFollowEl.style.setProperty('--glasses-y', `${(glassesY * motionScale).toFixed(2)}px`);
    }

    face.target.x = mood.lean || 0;
    face.target.rot = mood.tilt || 0;
    face.target.turn = mood.turn || 0;
  }

  function updateChannels(cur, vel, target, dt, config) {
    const steps = Math.max(1, Math.ceil(dt / (1 / 120)));
    const h = dt / steps;
    for (let step = 0; step < steps; step += 1) {
      for (const key in target) {
        const spring = config[key];
        const accel = (target[key] - cur[key]) * spring.k - vel[key] * spring.d;
        vel[key] += accel * h;
        cur[key] += vel[key] * h;
      }
    }
  }

  function updateFace(dt) {
    updateChannels(face.cur, face.vel, face.target, dt, FACE_SPRING);
  }

  function updateEyes(dt) {
    eyes.forEach((eye) => {
      const rate = eye.lidTarget > eye.lid ? 28 : 17;
      eye.lid += (eye.lidTarget - eye.lid) * (1 - Math.exp(-rate * dt));
      if (Math.abs(eye.lidTarget - eye.lid) < 0.001) {
        eye.lid = eye.lidTarget;
      }
      updateChannels(eye.cur, eye.vel, eye.target, dt, EYE_SPRING);
    });
  }

  function dynamicsFor(index, time) {
    const side = index === 0 ? -1 : 1;
    const elapsed = time - state.moodStart;
    const d = { x: 0, y: 0, rot: 0, sx: Math.sin(time * 1.15 + index * 1.9) * 0.018, sy: 0 };

    switch (state.mood) {
      case 'neutral': {
        d.y = Math.sin(time * 1.2 + index * 0.7) * 0.8;
        break;
      }
      case 'happy': {
        const bounce = Math.abs(Math.sin(time * 2.4 + index * 0.35));
        d.y = -bounce * 3.5;
        d.rot = side * 1.2;
        d.sx += bounce * 0.025;
        d.sy = -bounce * 0.03;
        break;
      }
      case 'sad': {
        d.y = Math.sin(time * 0.9 + index) * 1;
        d.rot = side * 1.5;
        d.sx += Math.sin(time * 0.9 + index) * 0.015;
        break;
      }
      case 'angry': {
        d.x = Math.sin(time * 34 + index * 2.1) * 0.7;
        d.y = Math.sin(time * 29) * 0.4;
        d.rot = Math.sin(time * 31 + index) * 0.7;
        d.sx += Math.sin(time * 27 + index * 1.7) * 0.028;
        break;
      }
      case 'surprised': {
        const settle = Math.exp(-elapsed * 3);
        const jitter = Math.sin(elapsed * 26) * settle * 2;
        d.x = jitter;
        d.y = Math.sin(elapsed * 20) * settle * 2;
        d.rot = jitter * 0.3;
        d.sx += Math.sin(time * 2 + index) * 0.012;
        break;
      }
      case 'curious': {
        d.x = Math.sin(time * 1.1 + index * 1.2) * 1.2;
        d.y = Math.sin(time * 1.4 + index) * 1.2;
        d.rot = Math.sin(time * 1.2) * 1.5;
        d.sx += Math.sin(time * 1.2 + index) * 0.018;
        break;
      }
      case 'focus': {
        d.x = Math.sin(time * 0.7 + index * 0.9) * 1.2;
        d.y = Math.sin(time * 0.9 + index) * 0.6;
        break;
      }
      case 'sleepy': {
        const droop = (Math.sin(time * 0.8) + 1) * 0.5;
        const fight = Math.pow(Math.max(0, Math.sin(time * 1.3 + index * 0.15)), 6);
        d.y = 1 + droop * 2 - fight * 3;
        d.sy = -0.1 * droop + 0.1 * fight;
        d.sx += Math.sin(time * 0.8 + index * 0.7) * 0.02 + fight * 0.015;
        break;
      }
      case 'wink': {
        d.y = Math.sin(time * 3.2) * 0.8;
        d.sx += Math.sin(time * 2.6) * 0.015;
        break;
      }
      case 'love': {
        const beat = Math.pow(Math.max(0, Math.sin(time * 3.8)), 10);
        d.y = -beat * 2.5;
        d.sx += beat * 0.06;
        d.sy = beat * 0.04;
        break;
      }
      case 'confused': {
        d.x = Math.sin(time * 2.2 + index * 2) * 1.5;
        d.y = Math.sin(time * 2.8) * 0.8;
        d.rot = Math.sin(time * 2.4 + index) * 2;
        d.sx += Math.sin(time * 2.4 + index * 2) * 0.018;
        break;
      }
      case 'excited': {
        const bounce = Math.abs(Math.sin(time * 5.2 + (index ? 0.5 : 0)));
        d.y = -bounce * 7;
        d.rot = side * bounce * 2;
        d.sx += bounce * 0.035;
        d.sy = -bounce * 0.03;
        break;
      }
      case 'dizzy': {
        const angle = time * 4.2 + (index ? Math.PI : 0);
        d.x = Math.cos(angle) * 6;
        d.y = Math.sin(angle) * 4.5;
        d.rot = Math.sin(angle) * 12;
        d.sx += Math.sin(angle) * 0.025;
        break;
      }
      default:
        break;
    }

    d.x *= motionScale;
    d.y *= motionScale;
    d.rot *= motionScale;
    d.sx *= motionScale;
    d.sy *= motionScale;
    return d;
  }

  function faceDynamics(time) {
    const elapsed = time - state.moodStart;
    const d = {
      x: Math.sin(time * 0.55) * 2.8,
      rot: Math.sin(time * 0.55 + 0.6) * 0.6,
      turn: Math.sin(time * 0.55 + 1.1) * 2.2,
      y: Math.sin(time * 1.15) * 1.4,
      scale: 0
    };

    switch (state.mood) {
      case 'curious': {
        d.x += Math.sin(time * 1.1) * 1.2;
        d.rot += Math.sin(time * 1.1) * 2.2;
        break;
      }
      case 'focus': {
        d.x += Math.sin(time * 0.7) * 0.8;
        d.rot += Math.sin(time * 0.7) * 0.45;
        break;
      }
      case 'sad': {
        d.x += Math.sin(time * 0.8) * 0.8;
        d.rot += -1 + Math.sin(time * 0.8) * 0.5;
        break;
      }
      case 'angry': {
        d.x += Math.sin(time * 30) * 0.3;
        d.rot += Math.sin(time * 30) * 0.35;
        break;
      }
      case 'surprised': {
        const settle = Math.exp(-elapsed * 3);
        d.x += Math.sin(elapsed * 20) * settle * 1.5;
        d.y += -8 * settle;
        d.scale += 0.02 * settle;
        break;
      }
      case 'happy': {
        const settle = Math.exp(-elapsed * 2.5);
        d.x += Math.sin(elapsed * 8) * settle * 1.2;
        d.y += -Math.sin(elapsed * 8) * 2 * settle;
        break;
      }
      case 'sleepy': {
        d.x += Math.sin(time * 0.9) * 1.4;
        d.y += Math.sin(time * 0.9) * 1.6;
        break;
      }
      case 'wink': {
        d.x += Math.sin(time * 3.2) * 0.5;
        d.rot += 1.8;
        break;
      }
      case 'love': {
        const beat = Math.pow(Math.max(0, Math.sin(time * 3.8)), 10);
        d.x += beat * 0.8;
        d.scale += beat * 0.008;
        break;
      }
      case 'confused': {
        d.x += Math.sin(time * 2.4) * 1.8;
        d.rot += Math.sin(time * 2.4) * 1.6;
        break;
      }
      case 'excited': {
        d.x += Math.sin(time * 5.2) * 2;
        d.y += -Math.abs(Math.sin(time * 5.2)) * 5;
        d.scale += Math.sin(time * 10.4) * 0.006;
        break;
      }
      case 'dizzy': {
        d.x += Math.sin(time * 4.2) * 2.5;
        d.rot += Math.sin(time * 4.2) * 3;
        d.y += Math.sin(time * 8.4) * 1.4;
        break;
      }
      default:
        break;
    }

    d.turn += d.x * 0.35;
    d.x *= motionScale;
    d.rot *= motionScale;
    d.turn *= motionScale;
    d.y *= motionScale;
    d.scale *= motionScale;
    return d;
  }

  const HEART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6C10.9 19.7 3 14.2 3 8.8 3 5.9 5.1 3.8 7.9 3.8c1.8 0 3.2 1 4.1 2.4.9-1.4 2.3-2.4 4.1-2.4 2.8 0 4.9 2.1 4.9 5 0 5.4-7.9 10.9-9 11.8z"/></svg>';
  const STAR_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0l2.6 8.5L23 11l-8.4 2.5L12 22l-2.6-8.5L1 11l8.4-2.5z"/></svg>';
  const SPIRAL_SVG = (() => {
    const center = 20;
    const turns = 2.4;
    const steps = 100;
    const maxRadius = 18;
    let path = '';
    for (let i = 0; i <= steps; i += 1) {
      const t = i / steps;
      const angle = t * turns * Math.PI * 2;
      const radius = maxRadius * t;
      const x = center + Math.cos(angle) * radius;
      const y = center + Math.sin(angle) * radius;
      path += `${i === 0 ? 'M' : 'L'}${x.toFixed(2)} ${y.toFixed(2)} `;
    }
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  })();

  function styleFx(element, vars) {
    for (const key in vars) {
      element.style.setProperty(`--${key}`, vars[key]);
    }
  }

  function addFx(element) {
    fxEl.appendChild(element);
    let removed = false;
    const remove = () => {
      if (removed) return;
      removed = true;
      element.remove();
    };
    element.addEventListener('animationend', remove, { once: true });
    window.setTimeout(remove, 3200);
  }

    element.className = 'fx-item fx-heart';
    element.innerHTML = HEART_SVG;
    styleFx(element, {
      x: `${rand(-110, 110)}px`,
      y: `${rand(-15, 45)}px`,
      dx: `${rand(-35, 35)}px`,
      rise: `${rand(80, 150)}px`,
      rot: `${rand(-25, 25)}deg`,
      spin: `${rand(-50, 50)}deg`,
      size: `${rand(10, 20)}px`,
      dur: `${rand(1.6, 2.5)}s`,
      alpha: rand(0.65, 0.98)
    });
    addFx(element);

  function spawnSparkle() {
    const element = document.createElement('span');
    element.className = 'fx-item fx-star';
    element.innerHTML = STAR_SVG;
    styleFx(element, {
      x: `${rand(-100, 100)}px`,

  function spawnSurpriseLine(angle) {
    const element = document.createElement('span');
    element.className = 'fx-item fx-line';
    const distance = rand(55, 85);
    const outward = rand(16, 32);
    styleFx(element, {
      x: `${Math.cos(angle) * distance}px`,
      y: `${Math.sin(angle) * distance * 0.8}px`,
      dx: `${Math.cos(angle) * outward}px`,
      dy: `${Math.sin(angle) * outward * 0.8}px`,
      rot: `${(angle * 180) / Math.PI + 90}deg`,
      h: `${rand(16, 28)}px`,
      dur: `${rand(0.55, 0.85)}s`,
      alpha: rand(0.55, 0.9)
    });
    addFx(element);
  }

  function burstSurprise() {
    for (let i = 0; i < 12; i += 1) {
      spawnSurpriseLine((i / 12) * Math.PI * 2);
    }
  }

  const FX = {
    happy: { burst: 4, interval: 0.6, spawn: spawnSparkle },
    curious: { burst: 2, interval: 1.2, spawn: spawnSparkle },
    surprised: { special: burstSurprise },
    sad: { burst: 4, interval: 0.5, spawn: spawnTear },
    sleepy: { burst: 3, interval: 0.65, spawn: spawnZ },
    wink: { burst: 3, spawn: spawnSparkle },
    love: { burst: 9, interval: 0.36, spawn: spawnHeart },
    confused: { burst: 3, interval: 0.75, spawn: spawnQuestion },
    excited: { burst: 8, interval: 0.3, spawn: spawnStar },
    dizzy: { burst: 6, interval: 0.45, spawn: spawnSpiral, count: 2 }
  };

  function startEffects(name) {
    fxEl.replaceChildren();
    state.fxNext = state.time + rand(0.4, 1);
    if (document.body.classList.contains('is-capture') || reduceMotion) return;

    const config = FX[name];
    if (!config) return;
    if (config.special) {
      config.special();
      return;
    }
    if (config.burst && config.spawn) {
      for (let i = 0; i < config.burst; i += 1) {
        config.spawn();
      }
    }
  }

  function updateEffects() {
    if (document.body.classList.contains('is-capture') || reduceMotion) return;
    const config = FX[state.mood];
    if (!config || !config.spawn || !config.interval) return;
    if (state.time < state.fxNext) return;

    const count = config.count || 1;
    for (let i = 0; i < count; i += 1) {
      config.spawn();
    }
    state.fxNext = state.time + config.interval * rand(0.8, 1.2);
  }

  function render() {
    if (!state.mood) return;

    const faceDyn = faceDynamics(state.time);
    const faceScale = face.cur.scale * (1 + faceDyn.scale + state.pop * 0.03);
    const faceX = face.cur.x + faceDyn.x;
    const faceY = face.cur.y + faceDyn.y - state.pop * 1.5;
    const faceRot = face.cur.rot + faceDyn.rot;
    const faceTurn = face.cur.turn + faceDyn.turn;

    faceEl.style.transform = `translate3d(${faceX.toFixed(3)}px, ${faceY.toFixed(3)}px, 0) rotate(${faceRot.toFixed(3)}deg) rotateY(${faceTurn.toFixed(3)}deg) scale(${faceScale.toFixed(4)})`;

    eyes.forEach((eye, index) => {
      const d = dynamicsFor(index, state.time);
      const lidScale = 1 - 0.94 * eye.lid;
      const x = eye.cur.x + d.x;
      const y = eye.cur.y + d.y;
      const rot = eye.cur.rot + d.rot;
      const sy = eye.cur.sy * (1 + d.sy) * lidScale;
      // Squash-and-stretch: short eyes thicken, stretched eyes slim down.
      const elastic = 1 + (1 - sy) * 0.12;
      const sx = eye.cur.sx * (1 + d.sx) * elastic;

      eye.el.style.transform = `translate3d(${x.toFixed(3)}px, ${y.toFixed(3)}px, 0) rotate(${rot.toFixed(3)}deg) scale(${sx.toFixed(4)}, ${sy.toFixed(4)})`;
    });
  }

  function burst(clientX, clientY) {
    const rect = stageEl.getBoundingClientRect();
    const originX = clientX - rect.left;
    const originY = clientY - rect.top;

    for (let i = 0; i < 12; i += 1) {
      const spark = document.createElement('span');
      spark.className = 'spark';
      const width = 1.5 + Math.random() * 2.2;
      const height = 5 + Math.random() * 9;
      spark.style.width = `${width.toFixed(2)}px`;
      spark.style.height = `${height.toFixed(2)}px`;
      spark.style.left = `${originX}px`;
      spark.style.top = `${originY}px`;
      spark.style.setProperty('--dx', `${rand(-80, 80).toFixed(1)}px`);
      spark.style.setProperty('--dy', `${rand(-110, -20).toFixed(1)}px`);
      spark.style.setProperty('--rot', `${rand(-180, 180).toFixed(1)}deg`);
      spark.style.animationDelay = `${rand(0, 45).toFixed(1)}ms`;
      stageEl.appendChild(spark);
      window.setTimeout(() => spark.remove(), 950);
    }
  }

  function frame(now) {
    if (!state.last) state.last = now;
    const dt = clamp((now - state.last) / 1000, 0, 1 / 20);
    state.last = now;
    state.time += dt;

    state.pop *= Math.exp(-dt * 7.5);
    if (state.pop < 0.002) state.pop = 0;

    updateGaze(dt);
    updateAuto();
    updateBlinkScheduler();
    updateEffects();
    updateTargets();
    updateFace(dt);
    updateEyes(dt);
    render();

    window.requestAnimationFrame(frame);
  }

  function handlePointerMove(event) {
    state.pointerInside = true;
    const rect = stageEl.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    state.pointerX = clamp((event.clientX - centerX) / (rect.width / 2 || 1), -1, 1);
    state.pointerY = clamp((event.clientY - centerY) / (rect.height / 2 || 1), -1, 1);
  }

  window.addEventListener('pointermove', handlePointerMove, { passive: true });

  document.addEventListener('pointerleave', () => {
    if (!window.matchMedia('(pointer: coarse)').matches) {
      state.pointerInside = false;
    }
  });

  window.addEventListener('pointerup', (event) => {
    if (event.pointerType === 'touch') {
      state.pointerInside = false;
    }
  });

  window.addEventListener('blur', () => {
    state.pointerInside = false;
  });

  chipsEl.addEventListener('click', (event) => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    setMood(chip.dataset.mood);
  });

  autoBtn.addEventListener('click', () => {
    setAuto(!state.auto);
  });

  blinkBtn.addEventListener('click', () => {
    blink();
    state.pop = Math.max(state.pop, 0.6);
  });

  randomBtn.addEventListener('click', () => {
    pickRandomMood();
  });

  eyes.forEach((eye) => {
    eye.el.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      state.pop = Math.max(state.pop, 1.25);
      blinkEye(eye, 0);
      blinkEye(eye === eyes[0] ? eyes[1] : eyes[0], 70);
      burst(event.clientX, event.clientY);
    });
  });

  window.addEventListener('keydown', (event) => {
    const active = document.activeElement;
    const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
    if (typing) return;

    if (event.code === 'Space') {
      const onButton = event.target instanceof Element && event.target.closest('button');
      if (onButton) return;
      event.preventDefault();
      blink();
      state.pop = Math.max(state.pop, 0.6);
      return;
    }

    if (event.key === 'a' || event.key === 'A') {
      setAuto(!state.auto);
    } else if (event.key === 'r' || event.key === 'R') {
      pickRandomMood();
    }
  });

  const params = new URLSearchParams(window.location.search);
  const requestedMood = params.get('mood');
  const still = params.has('still');
  const initialMood = requestedMood && MOODS[requestedMood] ? requestedMood : 'neutral';

  if (still) {
    document.body.classList.add('is-capture');
  }

  state.auto = state.auto && !still && !requestedMood;
  setMood(initialMood, { init: true });
  syncAutoButton();
  updateTargets();

  if (still) {
    eyes.forEach((eye) => {
      Object.assign(eye.cur, eye.target);
      eye.vel.x = 0;
      eye.vel.y = 0;
      eye.vel.rot = 0;
      eye.vel.sx = 0;
      eye.vel.sy = 0;
      eye.lid = eye.lidTarget;
    });
    Object.assign(face.cur, face.target);
    face.vel.x = 0;
    face.vel.rot = 0;
    face.vel.turn = 0;
    face.vel.y = 0;
    face.vel.scale = 0;
    state.pop = 0;
    render();
  } else {
    window.requestAnimationFrame(frame);
  }
})();
</script>

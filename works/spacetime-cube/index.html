<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>时空立方体</title>
<link rel="stylesheet" href="./styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<canvas id="view"></canvas>

<header id="bar">
  <span class="brand">时空立方体</span>

  <select id="sort" class="mini" title="照片的时间先后顺序">
    <option value="name">按文件名排序</option>
    <option value="time">按修改时间排序</option>
  </select>

  <button id="open" class="mini">打开照片</button>
  <span id="status" class="status">拖入照片，或点「打开照片」</span>
</header>

<aside id="panel">
  <div class="seg" id="mode">
    <button data-mode="solid">全不透明</button>
    <button data-mode="ghost">全半透明</button>
  </div>

  <label class="row">轨迹强度
    <input id="alpha" type="range" min="0" max="3" step="0.05" value="1.2">
  </label>

  <label class="row">背景抑制
    <input id="threshold" type="range" min="0" max="0.95" step="0.01" value="0">
  </label>

  <label class="row">画质
    <input id="quality" type="range" min="0.6" max="1.5" step="0.05" value="1">
  </label>

  <button id="reset" class="mini wide">复位视角</button>
</aside>

<footer id="foot">
  <span class="hint">拖动旋转 · 滚轮缩放 · 双击复位 · R 复位视角</span>
</footer>

<input id="file" type="file" accept="image/*" multiple hidden>

<div id="veil"><div class="veilbox"><div id="veiltext">准备中…</div><div class="bar"><i id="veilbar"></i></div></div></div>
<div id="fatal"></div>

<script type="module" src="./app.js"></script>
</body>
</html>

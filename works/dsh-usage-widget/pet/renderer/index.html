<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DS 鲸鱼娘 · Live2D 透明渲染</title>
<style>
  /* 关键：整页必须完全透明 —— 透明窗口里任何不透明背景都会变成一块灰/黑方块。
     background 用 transparent，并且不要给 html/body 设任何颜色。 */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }

  /* —— 以下两个 class 只在普通浏览器里用来看 alpha 对不对，桌面宿主里永远不启用 ——
     ?bg=checker  棋盘底：模型轮廓外的像素应当露出棋盘（证明是透明通道而不是白底）
     ?bg=desk     模拟桌面渐变底 */
  body.bg-checker { background: conic-gradient(#444b63 0 25%, #232838 0 50%, #444b63 0 75%, #232838 0) 0 0 / 28px 28px; }
  body.bg-desk    { background: linear-gradient(135deg, #16324f 0%, #3a2350 45%, #0d3b39 100%); }

  #status {
    position: fixed; left: 6px; bottom: 4px;
    font: 11px/1.5 Consolas, monospace;
    color: rgba(255,255,255,.55);
    text-shadow: 0 0 3px rgba(0,0,0,.8);
    pointer-events: none;
  }
  #err {
    position: fixed; left: 6px; top: 6px; right: 6px;
    font: 11px/1.5 Consolas, monospace;
    color: #ff8080; white-space: pre-wrap;
    pointer-events: none;
  }

  /* —— 状态标签（契约：pet/STATE-PROTOCOL.md）——
     文字与颜色全部来自 state.json 的 label/color，页面不自己判断状态。
     位置由 pet-app.js 的 placeState() 按**实测的人物包围盒 + 看板发布的锚点**绝对定位：
     右边缘与看板右对齐文字齐右，上边缘在「上方那行文字」下面 10~14px。
     下面的 right/top 只是量出来之前的兜底值，运行期会被 JS 覆盖。

     **定宽**（REACTIONS-SPEC §2.1）：标签最短「空闲」2 字、最长「数据过期」4 字，
     min-width 4em + 右对齐 + 等宽数字 → 文本盒宽度固定，换状态时左边缘不会左右抽动。
     不加底色块，避免在透明窗口里多出一块不透明矩形。 */
  #state-label {
    position: fixed;
    right: 6px; top: 6px;
    min-width: 4em;
    box-sizing: border-box;
    text-align: right;
    font: 600 14px/1.25 "Microsoft YaHei", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: .3px;
    text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.7);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .35s ease, color .35s ease;
  }
  #state-label.on { opacity: 1; }
  #state-detail {
    position: fixed;
    right: 6px; top: 26px;
    min-width: 4em;
    box-sizing: border-box;
    text-align: right;
    font: 11px/1.3 Consolas, monospace;
    font-variant-numeric: tabular-nums;
    color: rgba(220,228,240,.68);
    text-shadow: 0 0 4px rgba(0,0,0,.9);
    pointer-events: none;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .35s ease;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #state-detail.on { opacity: 1; }

  /* —— 气泡（台词 + 参数摘要脚注；逐字输出时逐字冒）——
     她自己头顶上方的一块半透明圆角气泡，浮在桌面上；不挡面板（面板在上层重提 topmost，
     而气泡画在人物头顶，位置由 reactions.js 按人物包围盒算）。 */
  #bubble {
    position: fixed;
    max-width: 62%;
    padding: 4px 8px 5px 8px;
    border-radius: 9px;
    background: rgba(27,31,39,.82);
    border: 1px solid rgba(121,192,255,.35);
    box-shadow: 0 2px 10px rgba(0,0,0,.45);
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s ease;
  }
  #bubble.on { opacity: 1; }
  #bubble .b-line {
    font: 600 12px/1.35 "Microsoft YaHei", system-ui, sans-serif;
    color: #E6EDF3;
    text-shadow: 0 0 3px rgba(0,0,0,.8);
    white-space: pre-wrap;
    word-break: break-all;
  }
  #bubble .b-foot {
    margin-top: 2px;
    font: 10px/1.3 Consolas, monospace;
    color: rgba(200,212,228,.72);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }

  /* —— qBounce：收工蹦一下（上游 `qBounce(1.2)` 是纯 CSS 位移，不碰模型参数）——
     故意**先往下弹**：向上会朝看板方向窜，向下只压到她自己的桌面区域。
     只作用在 canvas 上；标签/detail/气泡是独立元素，位置与对齐都不受影响。 */
  @keyframes qbounce {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(5px) scale(1.015); }
    70%  { transform: translateY(2px) scale(1.006); }
    100% { transform: translateY(0) scale(1); }
  }
  canvas.qbounce { animation: qbounce .5s ease-out; }

</style>
</head>
<body>
<div id="err"></div>
<div id="state-label"></div>
<div id="state-detail"></div>
<div id="bubble"></div>
<div id="status"></div>

<!-- 加载顺序不能变：cubism core 必须先于 cubism4(framework) 出现，pixi 必须在 framework 之前 -->
<script src="../model/vendor/live2dcubismcore.min.js"></script>
<script src="../model/vendor/pixi.min.js"></script>
<script src="../model/vendor/cubism4.min.js"></script>
<!-- ?v= 是**缓存戳**：pet.local 走 WebView2 的虚拟主机映射，没有 Cache-Control，改完 JS
     如果不换 URL，WebView2 会拿缓存里的旧脚本（实测踩过：新增的诊断字段一直不出现）。
     每次改 pet-app.js / reactions.js 都要把这两个数字 +1。 -->
<script src="./pet-app.js?v=26"></script>
<!-- 策略层：读 state.json + signals.json 决定表情/道具/动作/气泡（机制在 pet-app.js） -->
<script src="./reactions.js?v=26"></script>
</body>
</html>

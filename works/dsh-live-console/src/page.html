<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>__LIVE_CONSOLE_TITLE__</title>
<style>
  :root {
    --bg: #0b0d10;
    --bg-soft: #11151a;
    --bg-card: #151a20;
    --bg-hover: #1b212a;
    --border: #242c36;
    --border-soft: #1c232b;
    --text: #d7dee8;
    --text-dim: #8a97a8;
    --text-faint: #5d6a7a;
    --accent: #4d9dff;
    --accent-soft: #16324f;
    --green: #3ecf8e;
    --green-soft: #143528;
    --amber: #e8b34b;
    --amber-soft: #3a2f14;
    --red: #f06a6a;
    --red-soft: #3b1c1c;
    --purple: #b18cff;
    --mono: "Cascadia Code", "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f4f6f9;
    --bg-soft: #eaedf2;
    --bg-card: #ffffff;
    --bg-hover: #e3e8ef;
    --border: #d3dae4;
    --border-soft: #e2e7ee;
    --text: #1c2530;
    --text-dim: #5a6878;
    --text-faint: #8a97a8;
    --accent: #1f6feb;
    --accent-soft: #dbe9ff;
    --green: #12996b;
    --green-soft: #d8f3e7;
    --amber: #a5730a;
    --amber-soft: #faeed2;
    --red: #c93a3a;
    --red-soft: #fbdcdc;
    --purple: #7a55d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--sans);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header.top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    background: var(--bg-soft); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; letter-spacing: .2px; }
  .brand .logo { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); flex: none; }
  .brand small { color: var(--text-faint); font-weight: 400; font-size: 11px; margin-left: 2px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 13px; color: var(--text-dim); font-size: 12px;
    white-space: nowrap;
  }
  .pill:hover { background: var(--bg-hover); color: var(--text); }
  .pill[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .pill.live .dot { background: var(--green); box-shadow: 0 0 8px var(--green); animation: breathe 2s ease-in-out infinite; }
  .pill.down .dot { background: var(--red); }
  @keyframes breathe { 50% { opacity: .35; } }

  main { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); flex: 1; min-height: 0; }
  aside.sessions { border-right: 1px solid var(--border); background: var(--bg-soft); display: flex; flex-direction: column; min-height: 0; }
  .aside-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border-soft); color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; flex: none; }
  .aside-head .count { color: var(--text-faint); }
  .session-list { overflow-y: auto; flex: 1; padding: 6px; }
  .session-item { padding: 7px 9px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
  .session-item:hover { background: var(--bg-hover); }
  .session-item[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .session-title { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); }
  .session-title .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .session-title .state-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint); flex: none; }
  .session-title .state-dot.running { background: var(--green); box-shadow: 0 0 7px var(--green); }
  .session-meta { display: flex; gap: 8px; color: var(--text-faint); font-size: 10.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .session-meta .active { color: var(--amber); }
  .session-meta .child-tag { color: var(--purple); }
  .empty { padding: 18px 12px; color: var(--text-faint); font-size: 12px; line-height: 1.7; }

  section.content { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .content-head { padding: 11px 16px; border-bottom: 1px solid var(--border-soft); flex: none; }
  .content-title { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .content-title h1 { font-size: 15px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: min(70ch, 70vw); }
  .content-title .sid { font: 11px var(--mono); color: var(--text-faint); }
  .content-sub { margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; color: var(--text-faint); font-size: 11.5px; }
  .content-sub .cwd { font: 11px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70vw; }
  .dialogue-panel { margin: 8px 16px 0; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-card); flex: none; height: 238px; max-height: 42vh; display: flex; flex-direction: column; }
  .dialogue-panel[hidden] { display: none; }
  .dlg-head { display: flex; gap: 8px; align-items: center; padding: 4px 10px; border-bottom: 1px solid var(--border-soft); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .7px; flex: none; }
  .dlg-head .count { text-transform: none; letter-spacing: 0; }
  .dlg-body { overflow-y: auto; padding: 4px 10px 6px; flex: 1; min-height: 0; }
  .dlg-compose { display: flex; gap: 6px; align-items: flex-end; padding: 6px 8px; border-top: 1px solid var(--border-soft); flex: none; background: var(--bg-soft); }
  .dlg-compose textarea { flex: 1; min-width: 0; resize: none; height: 44px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font: 12px/1.45 var(--sans); outline: none; }
  .dlg-compose textarea:focus { border-color: var(--accent); }
  .dlg-compose .pill { height: 32px; flex: none; }
  .dlg-compose .pill[disabled] { opacity: .55; cursor: default; }
  .dlg-row { display: flex; gap: 8px; padding: 2px 0; font-size: 11.5px; line-height: 1.45; align-items: baseline; }
  .dlg-role { flex: none; width: 30px; font-weight: 600; }
  .dlg-row.user .dlg-role { color: var(--accent); }
  .dlg-row.assistant .dlg-role { color: var(--purple); }
  .dlg-time { flex: none; font: 10px var(--mono); color: var(--text-faint); }
  .dlg-text { min-width: 0; white-space: pre-wrap; word-break: break-word; color: var(--text-dim); }
  .empty.small { padding: 6px 2px; font-size: 11px; }
  .content-body { overflow-y: auto; padding: 12px 16px 40px; flex: 1; min-height: 0; }

  .overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .overview .ov-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg-card); }
  .overview .ov-card .k { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .7px; }
  .overview .ov-card .v { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .overview .ov-card .s { color: var(--text-faint); font-size: 11px; }

  .section-title { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .8px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }
  .section-title .n { color: var(--text-faint); letter-spacing: 0; }

  .job { border: 1px solid var(--border); background: var(--bg-card); border-radius: 10px; padding: 10px 12px 9px; margin-bottom: 9px; }
  .job.settled { opacity: .78; }
  .job-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .job-kind { font: 10px var(--mono); color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 0 4px; line-height: 15px; flex: none; }
  .job-label { font: 12px var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 140px; }
  .job-status { font-size: 10.5px; padding: 1px 7px; border-radius: 9px; white-space: nowrap; flex: none; }
  .job-status.running { color: var(--green); background: var(--green-soft); }
  .job-status.stopping { color: var(--amber); background: var(--amber-soft); }
  .job-status.completed { color: var(--accent); background: var(--accent-soft); }
  .job-status.killed, .job-status.failed { color: var(--red); background: var(--red-soft); }
  .job-actions { display: flex; gap: 6px; flex: none; }
  .icon-btn { height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-dim); font-size: 11px; }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }

  .progress-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .bar { position: relative; flex: 1; height: 7px; border-radius: 4px; background: var(--border-soft); overflow: hidden; min-width: 80px; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 0%; border-radius: 4px; background: var(--accent); transition: width .45s ease; }
  .bar.exact > i { background: linear-gradient(90deg, var(--accent), var(--green)); }
  .bar.estimate > i { background: var(--amber); }
  .bar.settled > i { background: var(--green); }
  .bar.error > i { background: var(--red); }
  .bar.activity::after {
    content: ""; position: absolute; inset: 0; width: 42%;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 65%, transparent), transparent);
    animation: sweep 1.6s ease-in-out infinite;
  }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(340%); } }
  .bar-label { font-size: 11px; color: var(--text-dim); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 112px; text-align: right; }
  .bar-label .src { color: var(--text-faint); }
  .bar-label .pct { color: var(--text); font-weight: 600; }

  .job-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .job-meta b { color: var(--text-dim); font-weight: 500; }
  .last-line { margin-top: 6px; font: 11px var(--mono); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-box { margin-top: 8px; display: none; }
  .log-box.open { display: block; }
  .log-box pre {
    margin: 0; max-height: 300px; overflow: auto; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border-soft); border-radius: 8px; font: 11px/1.5 var(--mono);
    color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
  }
  .log-box .log-note { font-size: 10.5px; color: var(--text-faint); margin: 4px 2px 0; display: flex; gap: 10px; }
  .log-box .log-note .warn { color: var(--amber); }

  .timeline { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg-card); }
  .event { display: grid; grid-template-columns: 62px 122px minmax(0, 1fr); gap: 8px; padding: 5px 10px; font-size: 11.5px; border-top: 1px solid var(--border-soft); align-items: baseline; }
  .event:first-child { border-top: none; }
  .event .t { font: 10.5px var(--mono); color: var(--text-faint); }
  .event .ty { color: var(--purple); font: 10.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event .sum { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .event.error .ty, .event.error .sum { color: var(--red); }
  .event:hover { background: var(--bg-hover); }
  .event.new { animation: flash 1s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }


  .usage-card { margin: 10px 16px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-card); box-shadow: 0 6px 22px rgba(0, 0, 0, .12); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; flex: none; }
  .usage-card[hidden] { display: none; }
  .uc-main { display: grid; grid-template-columns: repeat(5, minmax(100px, 1fr)); gap: 8px 16px; align-items: end; }
  .uc-k { display: block; color: var(--text-faint); font-size: 10.5px; letter-spacing: .4px; white-space: nowrap; }
  .uc-v { display: block; font-size: 16px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.3; }
  .uc-balance-v { display: block; font-size: 21px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; line-height: 1.2; }
  .uc-sub { display: block; color: var(--text-faint); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uc-actions { display: flex; gap: 6px; align-items: flex-start; }
  .uc-detail { grid-column: 1 / -1; border-top: 1px solid var(--border-soft); padding-top: 8px; max-height: 30vh; overflow: auto; }
  .uc-detail table { width: 100%; border-collapse: collapse; font-size: 11px; }
  .uc-detail th, .uc-detail td { padding: 3px 6px; text-align: right; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
  .uc-detail th:first-child, .uc-detail td:first-child { text-align: left; }
  .uc-detail td:first-child { max-width: 34ch; overflow: hidden; text-overflow: ellipsis; }
  .uc-detail .src { color: var(--text-faint); font: 10px var(--mono); }
  .uc-detail .usage-meta { margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; color: var(--text-faint); }
  .uc-detail .usage-meta .warn { color: var(--amber); }
  @media (max-width: 1100px) { .uc-main { grid-template-columns: repeat(3, minmax(110px, 1fr)); } }
  @media (max-width: 700px) { .usage-card { grid-template-columns: 1fr; } .uc-actions { justify-content: flex-start; } .uc-main { grid-template-columns: repeat(2, minmax(110px, 1fr)); } }

  .footer-note { margin-top: 18px; color: var(--text-faint); font-size: 11px; line-height: 1.8; }
  .footer-note code { font: 10.5px var(--mono); color: var(--text-dim); }
  .toast { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(120px, 28vh) minmax(0, 1fr); }
    aside.sessions { border-right: none; border-bottom: 1px solid var(--border); }
    .session-list { display: flex; gap: 4px; overflow-x: auto; overflow-y: hidden; }
    .session-item { flex: 0 0 210px; margin-bottom: 0; }
    .dialogue-panel { height: 200px; }
  }
  .pet {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 60;
    width: 216px;
    padding: 11px 14px 10px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--bg-card);
    box-shadow: 0 12px 34px rgba(0, 0, 0, .26);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: .96;
    pointer-events: auto;
    user-select: none;
    overflow: hidden;
    --pet-status: var(--green);
  }
  .pet > * {
    position: relative;
    z-index: 1;
  }
  .pet-code {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    border-radius: 16px;
    pointer-events: none;
  }
  .pet-code-line {
    position: absolute;
    left: 10px;
    right: 10px;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1.5;
    opacity: 0;
    white-space: nowrap;
    animation: pet-code-drift 5.2s linear infinite;
  }
  .pet-code-line:nth-child(1) { top: 28px; animation-delay: 0s; }
  .pet-code-line:nth-child(2) { top: 54px; animation-delay: 1.2s; }
  .pet-code-line:nth-child(3) { top: 80px; animation-delay: 2.4s; }
  .pet-code-line:nth-child(4) { top: 106px; animation-delay: 3.6s; }
  @keyframes pet-code-drift {
    0% { opacity: 0; transform: translateX(16px); }
    18% { opacity: .28; }
    78% { opacity: .22; }
    100% { opacity: 0; transform: translateX(-28px); }
  }
  .pet-head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: var(--text-faint);
    font: 10px var(--mono);
    letter-spacing: .1em;
    cursor: grab;
    touch-action: none;
  }
  .pet-head:active { cursor: grabbing; }
  .pet-head-left { display: inline-flex; align-items: center; gap: 6px; }
  .pet-grip { opacity: .45; letter-spacing: -2px; }
  .pet-live { display: inline-flex; align-items: center; gap: 5px; }
  .pet-live i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--pet-glow);
    box-shadow: 0 0 7px var(--pet-glow);
  }
  .pet-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--pet-status);
    font-size: 9px;
    letter-spacing: .04em;
  }
  .pet-status i {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--pet-status);
    box-shadow: 0 0 7px var(--pet-status);
  }
  .pet-face-wrap {
    position: relative;
    width: 82px;
    height: 78px;
    display: grid;
    place-items: center;
    perspective: 320px;
  }
  .pet-face {
    display: flex;
    align-items: center;
    gap: 12px;
    transform-style: preserve-3d;
    will-change: transform;
  }
  .pet-eye {
    position: relative;
    width: 14px;
    height: 56px;
    border-radius: 999px;
    background: linear-gradient(180deg, #ffffff 0%, #e3eaf5 60%, #b6c4d6 100%);
    box-shadow:
      0 0 0 0.5px rgba(8, 12, 24, .35),
      0 0 12px var(--pet-glow),
      0 0 26px var(--pet-glow);
    will-change: transform;
  }
  .pet-eye::after {
    content: "";
    position: absolute;
    left: 24%;
    top: 5%;
    width: 36%;
    height: 30%;
    border-radius: 999px;
    background: rgba(255, 255, 255, .9);
  }
  .pet-line {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 36px;
    padding: 0 2px;
  }
  .pet-line-text {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.55;
    text-align: center;
    animation: pet-line-in .35s ease both;
  }
  @keyframes pet-line-in {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pet-caption {
    max-width: 100%;
    overflow: hidden;
    color: var(--text-faint);
    font-size: 10px;
    line-height: 1;
    text-overflow: ellipsis;
    white-space: nowrap;
    animation: pet-caption-in .3s ease both;
  }
  .pet-foot {
    display: flex;
    align-items: baseline;
    gap: 7px;
    width: 100%;
  }
  .pet-mood {
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .pet-usage {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px;
    width: 100%;
    padding-top: 8px;
    border-top: 1px solid var(--border-soft);
  }
  .pet-usage-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .pet-usage-k {
    color: var(--text-faint);
    font-size: 8.5px;
    letter-spacing: .04em;
    opacity: .8;
  }
  .pet-usage-v {
    overflow: hidden;
    color: var(--text);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.2;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .pet-usage-v.is-peak { color: var(--red); }
  .pet-usage-v.is-offpeak { color: var(--green); }
  .pet-magnifier {
    position: absolute;
    right: 5px;
    bottom: -2px;
    z-index: 4;
    width: 24px;
    height: 24px;
    transform: rotate(-12deg);
    pointer-events: none;
    display: none;
  }
  .pet-magnifier.is-on { display: block; }
  .pet-magnifier-lens {
    position: absolute;
    left: 0;
    top: 0;
    width: 16px;
    height: 16px;
    border: 1.5px solid #cfe8ff;
    border-radius: 50%;
    background: rgba(150, 210, 255, .08);
    box-shadow: 0 0 7px rgba(180, 220, 255, .55);
  }
  .pet-magnifier-handle {
    position: absolute;
    left: 14px;
    top: 15px;
    width: 2px;
    height: 9px;
    border-radius: 2px;
    background: #cfe8ff;
    transform: rotate(-45deg);
    transform-origin: top center;
  }
  .pet-think-dots {
    position: absolute;
    right: 5px;
    top: 3px;
    z-index: 4;
    display: none;
    gap: 3px;
    pointer-events: none;
  }
  .pet-think-dots.is-on { display: flex; }
  .pet-think-dots i {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--pet-glow);
    animation: pet-dot-pulse 1.15s ease-in-out infinite;
  }
  .pet-think-dots i:nth-child(2) { animation-delay: .16s; }
  .pet-think-dots i:nth-child(3) { animation-delay: .32s; }
  @keyframes pet-dot-pulse {
    0%, 100% { opacity: .25; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(-2px); }
  }
  .pet-command,
  .pet-error,
  .pet-wait {
    position: absolute;
    z-index: 4;
    pointer-events: none;
    display: none;
    font-family: var(--mono);
  }
  .pet-command.is-on,
  .pet-error.is-on,
  .pet-wait.is-on { display: block; }
  .pet-command {
    left: 2px;
    bottom: 0;
    color: var(--pet-glow);
    font-size: 9px;
    opacity: .8;
  }
  .pet-error {
    right: 3px;
    top: 0;
    color: var(--red);
    font-size: 13px;
    font-weight: 700;
    text-shadow: 0 0 7px var(--red);
  }
  .pet-wait {
    right: 4px;
    top: 0;
    color: var(--amber);
    font-size: 11px;
    opacity: .9;
  }
  .pet[data-status="error"] {
    border-color: var(--red);
  }
  @keyframes pet-caption-in {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 760px) {
    .pet { width: 180px; right: 10px; bottom: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="logo"></span><span>__LIVE_CONSOLE_TITLE__</span><small>live</small></div>
    <div class="spacer"></div>
    <button class="pill" id="followBtn" aria-pressed="true" title="自动跟随最近活跃的对话"><span class="dot"></span>跟随最新</button>
    <button class="pill" id="childBtn" aria-pressed="false" title="显示 / 隐藏子会话（subagent）">子会话</button>
    <button class="pill" id="graphBtn" title="按关键词连接所有对话（在新标签打开）">图谱</button>
    <button class="pill" id="archiveBtn" title="下载所有会话上下文的 tar.gz 无损归档">归档</button>
    <button class="pill" id="themeBtn" title="切换亮色 / 暗色">主题</button>
    <span class="pill" id="connPill" title="页面与 DSH 主进程的连接状态"><span class="dot"></span><span id="connText">连接中</span></span>
  </header>
      <div class="usage-card" id="usageCard" hidden>
        <div class="uc-main">
          <div class="uc-balance"><span class="uc-k">账户余额</span><span class="uc-balance-v" id="ucBalance">—</span><span class="uc-sub" id="ucBalanceSub">CNY</span></div>
          <div class="uc-item"><span class="uc-k">今日花费</span><span class="uc-v" id="ucToday">—</span><span class="uc-sub" id="ucTodaySub"></span></div>
          <div class="uc-item"><span class="uc-k">总计花费</span><span class="uc-v" id="ucTotal">—</span><span class="uc-sub" id="ucTotalSub"></span></div>
          <div class="uc-item"><span class="uc-k">缓存命中</span><span class="uc-v" id="ucCache">—</span><span class="uc-sub" id="ucCalls">—</span></div>
          <div class="uc-item"><span class="uc-k">计费状态</span><span class="uc-v" id="ucPeak">—</span><span class="uc-sub" id="ucScan">—</span></div>
        </div>
        <div class="uc-actions">
          <button class="pill" id="usageBtn" aria-pressed="false" title="显示 / 收起按模型明细">用量详情</button>
          <button class="pill" id="usageRefresh" title="重新扫描会话日志与余额">刷新用量</button>
        </div>
        <div class="uc-detail" id="usageDetail" hidden></div>
      </div>
  <main>
    <aside class="sessions">
      <div class="aside-head"><span>对话</span><span class="count" id="sessionCount"></span></div>
      <div class="session-list" id="sessionList"></div>
    </aside>
    <section class="content">
      <div class="content-head">
        <div class="content-title">
          <h1 id="selTitle">等待会话…</h1>
          <span class="sid" id="selId"></span>
        </div>
        <div class="content-sub">
          <span class="cwd" id="selCwd"></span>
          <span id="selState"></span>
          <span id="selTurnStep"></span>
        </div>
      </div>
      <div class="dialogue-panel" id="dialoguePanel" hidden>
        <div class="dlg-head"><span>对话</span><span class="count" id="dialogueCount"></span></div>
        <div class="dlg-body" id="dialogueBody"></div>
        <div class="dlg-compose">
          <textarea id="dialogueInput" rows="2" placeholder="发消息给这个对话… Enter 发送，Shift+Enter 换行"></textarea>
          <button class="pill" id="dialogueSend" title="发送到当前 DSH 对话">发送</button>
        </div>
      </div>
      <div class="content-body" id="contentBody">
        <div class="empty">控制台已启动。当任何对话开始运行命令时，这里会自动显示任务、日志和进度。</div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<div class="pet" id="consolePet" aria-hidden="true">
  <div class="pet-code" id="petCode" aria-hidden="true">
    <span class="pet-code-line">const mood = await read();</span>
    <span class="pet-code-line">for (const line of logs) {</span>
    <span class="pet-code-line">  if (error) retry();</span>
    <span class="pet-code-line">return { ok: true };</span>
  </div>
  <div class="pet-head" id="petDrag" title="拖动调整位置，双击复位">
    <span class="pet-head-left"><span class="pet-grip">⠿</span><span>DSH 心情</span></span>
    <span class="pet-status" id="petStatus"><i></i><span id="petStatusText">空闲</span></span>
  </div>
  <div class="pet-face-wrap">
    <div class="pet-face" id="petFace">
      <span class="pet-eye" id="petEyeL"></span>
      <span class="pet-eye" id="petEyeR"></span>
    </div>
    <span class="pet-magnifier" id="petMagnifier"><i class="pet-magnifier-lens"></i><i class="pet-magnifier-handle"></i></span>
    <span class="pet-think-dots" id="petThink"><i></i><i></i><i></i></span>
    <span class="pet-command" id="petCommand">&gt;_</span>
    <span class="pet-error" id="petError">!</span>
    <span class="pet-wait" id="petWait">◷</span>
  </div>
  <div class="pet-line" id="petLine"></div>
  <div class="pet-foot">
    <span class="pet-mood" id="petMood">好奇</span>
    <span class="pet-caption" id="petCaption">由 DSH 同步</span>
  </div>
  <div class="pet-usage">
    <span class="pet-usage-item"><span class="pet-usage-k">峰谷</span><span class="pet-usage-v" id="petPeak">谷时</span></span>
    <span class="pet-usage-item"><span class="pet-usage-k">余额</span><span class="pet-usage-v" id="petBalance">—</span></span>
    <span class="pet-usage-item"><span class="pet-usage-k">今日</span><span class="pet-usage-v" id="petToday">—</span></span>
  </div>
</div>
<script>
(function () {
  "use strict";

  var BASE = location.pathname.replace(/\/+$/, "");
  if (BASE === "") BASE = "/live-console";
  // The page is served by the raw web carrier, so it authenticates with the
  // per-process link key carried in the URL rather than with a DSH cookie.
  var KEY = new URLSearchParams(location.search).get("k") || "";
  var Q = KEY ? "?k=" + encodeURIComponent(KEY) : "";
  var PAGE_VERSION = "__LIVE_CONSOLE_VERSION__";
  var STATE_URL = BASE + "/state" + Q;
  var LOG_URL = BASE + "/log" + Q + (Q ? "&" : "?") + "job=";
  var EVENTS_URL = BASE + "/events" + Q + (Q ? "&" : "?") + "v=" + encodeURIComponent(PAGE_VERSION);
  var USAGE_URL = BASE + "/usage" + Q;

  var store = {
    at: 0,
    pageTitle: document.title,
    sessions: [],
    jobs: [],
    events: [],
    selectedId: null,
    follow: true,
    showChildren: false,
    theme: localStorage.getItem("dsh-live-console-theme") || "dark",
    connected: false,
    expanded: new Set(),
    logCache: new Map(),
    logTimers: new Map(),
    usage: null
  };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };
  var fmtInt = function (value) {
    var number = typeof value === "number" && isFinite(value) ? Math.round(value) : 0;
    return number.toLocaleString("en-US");
  };
  var fmtTokens = function (value) {
    var number = typeof value === "number" && isFinite(value) ? Math.max(0, value) : 0;
    if (number >= 1e9) return (number / 1e9).toFixed(2) + "B";
    if (number >= 1e6) return (number / 1e6).toFixed(2) + "M";
    if (number >= 1e3) return (number / 1e3).toFixed(1) + "K";
    return fmtInt(number);
  };
  var fmtBytes = function (value) {
    var number = typeof value === "number" && isFinite(value) ? value : 0;
    if (number < 1024) return number + " B";
    if (number < 1024 * 1024) return (number / 1024).toFixed(1) + " KB";
    return (number / 1024 / 1024).toFixed(2) + " MB";
  };
  var fmtDur = function (ms) {
    var value = typeof ms === "number" && isFinite(ms) ? Math.max(0, ms) : 0;
    if (value < 1000) return Math.round(value) + "ms";
    var s = Math.floor(value / 1000);
    if (s < 60) return s + "s";
    var m = Math.floor(s / 60);
    var rest = s % 60;
    if (m < 60) return m + "m" + (rest < 10 ? "0" : "") + rest + "s";
    var h = Math.floor(m / 60);
    return h + "h" + (m % 60) + "m";
  };
  var fmtAgo = function (at) {
    if (typeof at !== "number" || at <= 0) return "—";
    var delta = Date.now() - at;
    if (delta < 2000) return "刚刚";
    if (delta < 60000) return Math.floor(delta / 1000) + "s 前";
    if (delta < 3600000) return Math.floor(delta / 60000) + "m 前";
    return new Date(at).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" });
  };
  var fmtClock = function (epoch) {
    if (typeof epoch !== "number" || epoch <= 0) return "";
    return new Date(epoch).toLocaleTimeString("zh-CN", { hour12: false });
  };
  var sourceLabel = function (source) {
    switch (source) {
      case "output": return "输出进度";
      case "registry": return "注册表进度";
      case "file": return "进度文件";
      case "estimate-time": return "历史耗时估算";
      case "estimate-output": return "历史输出量估算";
      case "settled": return "已结束";
      default: return "无进度信号";
    }
  };
  var progressClass = function (job) {
    if (job.settled) return job.status === "failed" || job.status === "killed" ? "error" : "settled";
    if (job.percent === null || job.percent === undefined) return "activity";
    if (job.progressSource === "estimate-time" || job.progressSource === "estimate-output") return "estimate";
    return "exact";
  };

  var toastTimer = null;
  var toast = function (text) {
    var node = $("toast");
    node.textContent = text;
    node.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { node.classList.remove("show"); }, 1800);
  };

  var activeSessions = function () {
    return store.sessions.filter(function (session) {
      return store.showChildren || !session.isChild;
    });
  };
  var sessionById = function (id) {
    for (var i = 0; i < store.sessions.length; i += 1) {
      if (store.sessions[i].id === id) return store.sessions[i];
    }
    return null;
  };
  var jobsFor = function (id) {
    return store.jobs.filter(function (job) { return job.session === id; });
  };
  var eventsFor = function (id) {
    return store.events.filter(function (event) { return event.sessionId === id; });
  };
  var hasRunningJob = function () {
    return store.jobs.some(function (job) { return !job.settled; });
  };

  var pickFollowed = function () {
    var list = activeSessions();
    if (list.length === 0) return null;
    var best = null;
    var bestScore = -1;
    for (var i = 0; i < list.length; i += 1) {
      var session = list[i];
      var score = session.lastActivity || 0;
      if (session.activeJobs > 0) score += 100000000;
      if (session.running) score += 50000000;
      if (score > bestScore) { bestScore = score; best = session.id; }
    }
    return best;
  };

  var ensureSelection = function () {
    if (store.follow) {
      var followed = pickFollowed();
      if (followed !== null) store.selectedId = followed;
    } else if (store.selectedId !== null && sessionById(store.selectedId) === null) {
      store.selectedId = hasRunningJob() ? pickFollowed() : null;
    }
    if (store.selectedId === null && activeSessions().length > 0) store.selectedId = activeSessions()[0].id;
  };

  var renderSessions = function () {
    var list = activeSessions();
    $("sessionCount").textContent = list.length + " 个";
    var html = [];
    if (list.length === 0) {
      html.push('<div class="empty">还没有活跃对话。发一条消息给 DSH，任意命令都会出现在这里。</div>');
    }
    for (var i = 0; i < list.length; i += 1) {
      var session = list[i];
      var title = session.title || session.cwd || session.short || "未命名对话";
      var titleLabel = session.title ? session.title : (session.cwd ? session.cwd.replace(/^.*[\\/]/, "") || session.cwd : session.short);
      var cls = session.id === store.selectedId ? ' aria-current="true"' : "";
      var active = session.activeJobs > 0 ? '<span class="active">' + session.activeJobs + " 个运行中</span>" : "";
      var child = session.isChild ? '<span class="child-tag">子会话</span>' : "";
      var step = session.currentStep !== null && session.currentTurn !== null
        ? "<span>T" + session.currentTurn + " · S" + session.currentStep + "</span>" : "";
      html.push(
        '<div class="session-item" data-id="' + esc(session.id) + '"' + cls + ' title="' + esc(session.id) + '">' +
          '<div class="session-title"><span class="state-dot' + (session.running ? " running" : "") + '"></span>' +
            '<span class="name">' + esc(titleLabel) + "</span></div>" +
          '<div class="session-meta"><span>' + esc(session.short || "") + "</span>" + step + active + child +
            "<span>" + fmtAgo(session.lastActivity) + "</span></div>" +
        "</div>"
      );
    }
    $("sessionList").innerHTML = html.join("");
  };

  var renderHead = function () {
    var session = store.selectedId === null ? null : sessionById(store.selectedId);
    if (session === null) {
      $("selTitle").textContent = "等待会话…";
      $("selId").textContent = "";
      $("selCwd").textContent = "";
      $("selState").textContent = "";
      $("selTurnStep").textContent = "";
      return;
    }
    $("selTitle").textContent = session.title || session.cwd || "未命名对话";
    $("selId").textContent = session.id;
    $("selCwd").textContent = session.cwd || "";
    $("selState").textContent = session.running ? "运行中" : (session.activeJobs > 0 ? "有任务运行" : "空闲");
    $("selTurnStep").textContent = session.currentTurn !== null && session.currentStep !== null
      ? "第 " + session.currentTurn + " 轮 · 第 " + session.currentStep + " 步"
      : (session.currentTurn !== null ? "第 " + session.currentTurn + " 轮" : "");
  };

  var renderDialogue = function () {
    var panel = $("dialoguePanel");
    if (!panel) return;
    var session = store.selectedId === null ? null : sessionById(store.selectedId);
    if (session === null) {
      panel.hidden = true;
      return;
    }
    var messages = Array.isArray(session.dialogue) ? session.dialogue : [];
    panel.hidden = false;
    $("dialogueCount").textContent = messages.length + " 条";
    var body = $("dialogueBody");
    if (messages.length === 0) {
      body.innerHTML = '<div class="empty small">这个对话还没有消息。</div>';
      return;
    }
    var nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
    var html = [];
    for (var i = 0; i < messages.length; i += 1) {
      var message = messages[i];
      var isUser = message.role === "user";
      html.push('<div class="dlg-row ' + (isUser ? "user" : "assistant") + '">' +
        '<span class="dlg-role">' + (isUser ? "你" : "模型") + "</span>" +
        '<span class="dlg-time">' + fmtClock(message.time) + "</span>" +
        '<span class="dlg-text">' + esc(message.text) + "</span>" +
      "</div>");
    }
    body.innerHTML = html.join("");
    if (nearBottom) body.scrollTop = body.scrollHeight;
  };

  var jobCardHtml = function (job) {
    var cls = progressClass(job);
    var percent = job.percent === null || job.percent === undefined ? null : Math.max(0, Math.min(100, job.percent));
    var width = percent === null ? 0 : percent;
    var src = sourceLabel(job.progressSource);
    var tail = "无进度信号";
    if (job.settled) tail = "<span class=\"pct\">100%</span> <span class=\"src\">已结束</span>";
    else if (percent !== null) tail = "<span class=\"pct\">" + percent.toFixed(percent < 10 ? 1 : 0) + "%</span> <span class=\"src\">" + esc(src) + "</span>";
    else tail = "<span class=\"src\">" + esc(src) + "</span>";
    var eta = "";
    if (!job.settled && job.etaMs !== null && job.etaMs !== undefined) eta = " · 剩余 " + fmtDur(job.etaMs);
    var expanded = store.expanded.has(job.id);
    var logOpen = expanded ? " open" : "";
    var status = job.status || "running";
    var evidence = job.evidence ? ' title="' + esc(job.evidence) + '"' : "";
    return '<div class="job' + (job.settled ? " settled" : "") + '" data-job="' + esc(job.id) + '">' +
      '<div class="job-head">' +
        '<span class="job-kind">' + esc(job.kind) + "</span>" +
        '<span class="job-label" title="' + esc(job.label) + '">' + esc(job.label || "(未命名命令)") + "</span>" +
        '<span class="job-status ' + esc(status) + '">' + esc(status) + "</span>" +
        '<span class="job-actions">' +
          '<button class="icon-btn" data-act="toggle" data-id="' + esc(job.id) + '">' + (expanded ? "收起日志" : "展开日志") + "</button>" +
          '<button class="icon-btn" data-act="copy" data-id="' + esc(job.id) + '">复制命令</button>' +
        "</span>" +
      "</div>" +
      '<div class="progress-row">' +
        '<div class="bar ' + cls + '"' + evidence + '><i style="width:' + width + '%"></i></div>' +
        '<div class="bar-label">' + tail + eta + "</div>" +
      "</div>" +
      '<div class="job-meta">' +
        "<span>已运行 <b>" + fmtDur(job.elapsedMs) + "</b></span>" +
        "<span>输出 <b>" + fmtBytes(job.bytes) + "</b> / " + fmtInt(job.lines) + " 行</span>" +
        (job.lastOutputAt ? "<span>最后输出 <b>" + fmtAgo(job.lastOutputAt) + "</b></span>" : "<span>尚无输出</span>") +
        (job.settled && job.finishedAt ? "<span>结束于 <b>" + fmtClock(job.finishedAt) + "</b></span>" : "") +
        (job.truncated ? '<span class="warn">日志已截断</span>' : "") +
      "</div>" +
      (job.lastLine ? '<div class="last-line" title="最后一行输出">▸ ' + esc(job.lastLine) + "</div>" : "") +
      '<div class="log-box' + logOpen + '"><pre data-log="' + esc(job.id) + '">' + (expanded ? esc(cachedLog(job.id)) : "") + "</pre>" +
        '<div class="log-note"><span data-lognote="' + esc(job.id) + '">' + (expanded ? "正在载入日志…" : "") + "</span></div></div>" +
    "</div>";
  };

  var cachedLog = function (id) {
    var entry = store.logCache.get(id);
    return entry === undefined ? "" : entry.text;
  };

  var renderContent = function () {
    var session = store.selectedId === null ? null : sessionById(store.selectedId);
    var body = $("contentBody");
    if (session === null) {
      var running = store.jobs.filter(function (job) { return !job.settled; });
      if (running.length === 0) {
        body.innerHTML = '<div class="empty">控制台已启动。当任何对话开始运行命令时，这里会自动显示任务、日志和进度。</div>';
        return;
      }
      body.innerHTML = '<div class="section-title">所有运行中的任务 <span class="n">' + running.length + "</span></div>" +
        running.map(jobCardHtml).join("");
      bindJobActions();
      return;
    }
    var jobs = jobsFor(session.id);
    var feed = eventsFor(session.id).slice(-120).reverse();
    var overview = '<div class="overview">' +
      '<div class="ov-card"><div class="k">任务</div><div class="v">' + jobs.length + '</div><div class="s">' + jobs.filter(function (job) { return !job.settled; }).length + " 个运行中</div></div>" +
      '<div class="ov-card"><div class="k">事件</div><div class="v">' + eventsFor(session.id).length + '</div><div class="s">最近 ' + feed.length + " 条显示</div></div>" +
      '<div class="ov-card"><div class="k">状态</div><div class="v">' + (session.running ? "运行中" : "空闲") + '</div><div class="s">' + (session.isChild ? "子会话" : "主会话") + "</div></div>" +
    "</div>";
    var jobsHtml = jobs.length === 0
      ? '<div class="empty">这个对话还没有运行过命令。</div>'
      : jobs.map(jobCardHtml).join("");
    var feedHtml = feed.length === 0
      ? '<div class="empty">还没有可显示的事件。</div>'
      : feed.map(function (event) {
          return '<div class="event' + (event.tone === "error" ? " error" : "") + '">' +
            '<span class="t">' + fmtClock(event.time) + "</span>" +
            '<span class="ty">' + esc(event.type) + "</span>" +
            '<span class="sum" title="' + esc(event.summary) + '">' + esc(event.summary) + "</span>" +
          "</div>";
        }).join("");
    body.innerHTML = overview +
      '<div class="section-title">命令与进度 <span class="n">' + jobs.length + "</span></div>" + jobsHtml +
      '<div class="section-title">对话事件 <span class="n">' + feed.length + "</span></div>" +
      '<div class="timeline">' + feedHtml + "</div>" +
      '<div class="footer-note">进度来源：<b>输出进度</b> 来自程序自己打印的 <code>[progress 3/10]</code> / <code>42%</code> / <code>step 3/10</code>；' +
        "<b>历史估算</b> 来自同一命令此前运行的中位耗时/输出量，最多估算到 95%；没有可算的数字时显示活动条（只表示仍在运行）。" +
        "页面由 DSH Live Console 插件提供，每 0.7 秒刷新。</div>";
    bindJobActions();
    restoreLogs();
  };

  var bindJobActions = function () {
    var buttons = document.querySelectorAll("[data-act]");
    for (var i = 0; i < buttons.length; i += 1) {
      buttons[i].addEventListener("click", function (event) {
        var target = event.currentTarget;
        var id = target.getAttribute("data-id");
        var act = target.getAttribute("data-act");
        if (act === "toggle") {
          if (store.expanded.has(id)) store.expanded.delete(id);
          else store.expanded.add(id);
          renderContent();
        } else if (act === "copy") {
          var job = null;
          for (var j = 0; j < store.jobs.length; j += 1) if (store.jobs[j].id === id) job = store.jobs[j];
          if (job !== null) {
            var text = job.label || "";
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(function () { toast("已复制命令"); }, function () { toast(text); });
            } else {
              toast(text);
            }
          }
        }
      });
    }
    var sessions = document.querySelectorAll(".session-item");
    for (var k = 0; k < sessions.length; k += 1) {
      sessions[k].addEventListener("click", function (event) {
        store.follow = false;
        $("followBtn").setAttribute("aria-pressed", "false");
        store.selectedId = event.currentTarget.getAttribute("data-id");
        renderSessions();
        renderHead();
        renderContent();
      });
    }
  };

  var restoreLogs = function () {
    store.expanded.forEach(function (id) {
      var job = null;
      for (var i = 0; i < store.jobs.length; i += 1) if (store.jobs[i].id === id) job = store.jobs[i];
      if (job === null) return;
      var pre = document.querySelector('pre[data-log="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
      if (pre !== null) {
        pre.textContent = cachedLog(id);
        if (job.settled !== true) {
          pre.scrollTop = pre.scrollHeight;
        }
      }
      if (!store.logTimers.has(id)) {
        var timer = setInterval(function () { refreshLog(id); }, 1200);
        store.logTimers.set(id, timer);
        refreshLog(id);
      }
    });
    store.logTimers.forEach(function (timer, id) {
      if (!store.expanded.has(id)) {
        clearInterval(timer);
        store.logTimers.delete(id);
      }
    });
  };

  var refreshLog = function (id) {
    fetch(LOG_URL + encodeURIComponent(id), { cache: "no-store" })
      .then(function (response) { return response.json(); })
      .then(function (data) {
        if (data.error) return;
        var previous = store.logCache.get(id);
        var wasAtBottom = true;
        var pre = document.querySelector('pre[data-log="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
        if (pre !== null) wasAtBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 60;
        store.logCache.set(id, { text: data.text || "", bytes: data.bytes, lines: data.lines, truncated: data.truncated });
        if (pre !== null) {
          pre.textContent = data.text || "";
          if (wasAtBottom) pre.scrollTop = pre.scrollHeight;
        }
        var note = document.querySelector('[data-lognote="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
        if (note !== null) {
          note.innerHTML = fmtBytes(data.bytes) + " / " + fmtInt(data.lines) + " 行" +
            (data.truncated ? ' <span class="warn">日志已截断</span>' : "");
        }
      })
      .catch(function () {});
  };

  var fmtUsd = function (value) {
    var n = typeof value === "number" && isFinite(value) ? value : 0;
    return "$" + (n < 1 ? n.toFixed(4) : n.toFixed(2));
  };
  var fmtCny = function (value) {
    var n = typeof value === "number" && isFinite(value) ? value : 0;
    return "￥" + (n < 1 ? n.toFixed(4) : n.toFixed(2));
  };
  var renderUsagePanel = function () {
    var detail = $("usageDetail");
    if (!detail) return;
    var usage = store.usage;
    if (!usage || usage.enabled !== true) {
      detail.innerHTML = '<div class="empty">用量统计未启用。</div>';
      return;
    }
    var totals = usage.totals || {};
    var today = usage.today || {};
    var models = Array.isArray(usage.models) ? usage.models : [];
    var src = usage.source || {};
    var html = '<table><thead><tr><th>模型</th><th>调用</th><th>命中 tokens</th><th>未命中</th><th>输出</th><th>花费</th></tr></thead><tbody>';
    for (var i = 0; i < models.length; i += 1) {
      var row = models[i];
      var tokens = row.tokens || {};
      html += '<tr><td title="' + esc(row.model) + '">' + esc(row.label || row.model) +
        ' <span class="src">' + esc(row.model) + '</span></td>' +
        "<td>" + fmtInt(row.calls) + "</td>" +
        "<td>" + fmtTokens(tokens.cacheHit) + "</td>" +
        "<td>" + fmtTokens(tokens.cacheMiss) + "</td>" +
        "<td>" + fmtTokens(tokens.output) + "</td>" +
        "<td>" + fmtUsd(row.costUsd) + " / " + fmtCny(row.costCny) + "</td></tr>";
    }
    html += "</tbody></table>";
    html += '<div class="usage-meta">' +
      "<span>今日 " + fmtUsd(today.costUsd) + " · " + fmtInt(today.calls) + " 次调用</span>" +
      "<span>总计 " + fmtUsd(totals.costUsd) + " · " + fmtInt(totals.calls) + " 次 / " + fmtInt(totals.sessions) + " 个会话</span>" +
      "<span>扫描 " + fmtInt(src.artifacts) + " 个日志文件 / " + fmtInt(src.elapsedMs) + " ms</span>" +
      (usage.sweeping ? '<span class="warn">正在重新扫描…</span>' : "") +
      (usage.error ? '<span class="warn">' + esc(usage.error) + "</span>" : "") +
      (usage.at ? "<span>更新于 " + fmtClock(usage.at) + "</span>" : "") +
      "</div>";
    detail.innerHTML = html;
  };
  var renderUsage = function () {
    var card = $("usageCard");
    if (card === null) return;
    var usage = store.usage;
    if (!usage || usage.enabled !== true) {
      card.hidden = true;
      return;
    }
    card.hidden = false;
    var set = function (id, content, title) {
      var node = $(id);
      if (node === null) return;
      node.textContent = content;
      if (title !== undefined) node.title = title;
    };
    var today = usage.today || {};
    var totals = usage.totals || {};
    var balance = usage.balance;
    if (balance && balance.ok === true) {
      var prefix = balance.currency === "CNY" ? "￥" : (balance.currency ? balance.currency + " " : "");
      set("ucBalance", prefix + balance.total, "DeepSeek 账户余额");
      set("ucBalanceSub", (balance.currency || "CNY") + " · 剩余可用");
    } else {
      set("ucBalance", "—", balance && balance.error ? String(balance.error) : "余额不可用");
      set("ucBalanceSub", balance && balance.error ? "余额读取失败" : "CNY");
    }
    set("ucToday", fmtUsd(today.costUsd), "今日花费（UTC 日，峰谷价）");
    set("ucTodaySub", fmtCny(today.costCny) + " · " + fmtInt(today.calls) + " 次");
    set("ucTotal", fmtUsd(totals.costUsd), "全部会话日志累计");
    set("ucTotalSub", fmtCny(totals.costCny) + " · " + fmtInt(totals.sessions) + " 个会话");
    set("ucCache", ((Number(totals.cacheHitShare) || 0) * 100).toFixed(1) + "%", "缓存命中率");
    set("ucCalls", fmtInt(totals.calls) + " 次模型调用");
    if (usage.peakNow === true) {
      set("ucPeak", "峰时");
      var peak = $("ucPeak");
      if (peak) peak.style.color = "var(--red)";
    } else if (usage.peakNow === false) {
      set("ucPeak", "谷时");
      var off = $("ucPeak");
      if (off) off.style.color = "var(--green)";
    } else {
      set("ucPeak", "—");
    }
    set("ucScan", usage.sweeping ? "正在扫描…" : (usage.at ? "更新于 " + fmtClock(usage.at) : "等待扫描"));
    var detail = $("usageDetail");
    if (detail && detail.hidden === false) renderUsagePanel();
  };

  var renderAll = function () {
    ensureSelection();
    renderSessions();
    renderHead();
    renderContent();
    renderUsage();
    renderDialogue();
  };

  var applySnapshot = function (data) {
    store.at = data.at || Date.now();
    store.pageTitle = data.pageTitle || store.pageTitle;
    if (data.usage) store.usage = data.usage;
    store.sessions = Array.isArray(data.sessions) ? data.sessions : [];
    store.jobs = Array.isArray(data.jobs) ? data.jobs : [];
    if (Array.isArray(data.events)) {
      var seen = {};
      store.events = store.events.concat(data.events).filter(function (eventItem) {
        if (seen[eventItem.seq]) return false;
        seen[eventItem.seq] = true;
        return true;
      }).slice(-3000);
    }
    renderAll();
  };

  var applyUpdate = function (data) {
    store.at = data.at || Date.now();
    if (data.usage) store.usage = data.usage;
    if (Array.isArray(data.sessions)) store.sessions = data.sessions;
    if (Array.isArray(data.jobs)) store.jobs = data.jobs;
    if (Array.isArray(data.events) && data.events.length > 0) {
      store.events = store.events.concat(data.events).slice(-3000);
    }
    renderAll();
  };

  var setConnected = function (connected) {
    store.connected = connected;
    var pill = $("connPill");
    pill.classList.toggle("live", connected);
    pill.classList.toggle("down", !connected && store.at > 0);
    $("connText").textContent = connected ? "已连接" : (store.at > 0 ? "重连中" : "连接中");
  };

  var connect = function () {
    var source;
    try {
      source = new EventSource(EVENTS_URL);
    } catch (error) {
      setTimeout(pollFallback, 1500);
      return;
    }
    source.addEventListener("snapshot", function (message) {
      try { applySnapshot(JSON.parse(message.data)); setConnected(true); } catch (error) { /* ignore */ }
    });
    source.addEventListener("update", function (message) {
      try { applyUpdate(JSON.parse(message.data)); setConnected(true); } catch (error) { /* ignore */ }
    });
    source.onopen = function () { setConnected(true); };
    source.onerror = function () {
      setConnected(false);
      pollFallback();
    };
  };

  var pollTimer = null;
  var pollFallback = function () {
    if (pollTimer !== null) return;
    pollTimer = setInterval(function () {
      fetch(STATE_URL, { cache: "no-store" })
        .then(function (response) { return response.json(); })
        .then(function (data) { applySnapshot(data); setConnected(true); })
        .catch(function () { setConnected(false); });
    }, 3000);
    fetch(STATE_URL, { cache: "no-store" })
      .then(function (response) { return response.json(); })
      .then(function (data) { applySnapshot(data); });
  };

  $("followBtn").addEventListener("click", function () {
    store.follow = !store.follow;
    $("followBtn").setAttribute("aria-pressed", store.follow ? "true" : "false");
    if (store.follow) toast("已开启：自动跟随最新对话");
    renderAll();
  });
  $("childBtn").addEventListener("click", function () {
    store.showChildren = !store.showChildren;
    $("childBtn").setAttribute("aria-pressed", store.showChildren ? "true" : "false");
    renderAll();
  });
  $("archiveBtn").addEventListener("click", function () {
    window.open(location.origin + BASE + "/context-archive" + Q, "_blank", "noopener,noreferrer");
  });
  $("graphBtn").addEventListener("click", function () {
    window.open(location.origin + BASE + "/graph" + Q, "_blank", "noopener,noreferrer");
  });
  $("themeBtn").addEventListener("click", function () {
    store.theme = store.theme === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", store.theme);
    localStorage.setItem("dsh-live-console-theme", store.theme);
  });

  var sendDialogue = function () {
    var input = $("dialogueInput");
    var button = $("dialogueSend");
    if (!input || !button) return;
    var session = store.selectedId === null ? null : sessionById(store.selectedId);
    if (session === null) { toast("先选择一个对话"); return; }
    var text = input.value.trim();
    if (text.length === 0) return;
    button.disabled = true;
    var label = button.textContent;
    button.textContent = "发送中…";
    fetch(BASE + "/send" + Q, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId: session.id, text: text })
    })
      .then(function (response) {
        return response.json().then(function (body) { return { ok: response.ok, body: body }; });
      })
      .then(function (result) {
        if (!result.ok) throw new Error((result.body && result.body.error) || "HTTP error");
        input.value = "";
        toast("已发送到对话");
      })
      .catch(function (error) { toast("发送失败：" + (error && error.message ? error.message : error)); })
      .finally(function () {
        button.disabled = false;
        button.textContent = label;
      });
  };
  $("dialogueSend").addEventListener("click", sendDialogue);
  $("dialogueInput").addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendDialogue();
    }
  });
  $("usageBtn").addEventListener("click", function () {
    var detail = $("usageDetail");
    var open = detail.hidden === true;
    detail.hidden = open === false;
    $("usageBtn").setAttribute("aria-pressed", open ? "true" : "false");
    if (open) renderUsagePanel();
  });
  $("usageRefresh").addEventListener("click", function () {
    var button = this;
    var label = button.textContent;
    button.disabled = true;
    button.textContent = "扫描中…";
    fetch(USAGE_URL + (Q ? "&" : "?") + "refresh=1", { cache: "no-store" })
      .then(function (response) { return response.json(); })
      .then(function (data) { if (data && data.usage) { store.usage = data.usage; renderUsage(); } })
      .catch(function () {})
      .finally(function () { button.disabled = false; button.textContent = label; });
  });

  document.documentElement.setAttribute("data-theme", store.theme);

  setInterval(function () {
    if (!store.connected) return;
    renderSessions();
    renderHead();
    var body = $("contentBody");
    if (body !== null && document.activeElement === document.body) {
      // keep relative timestamps and elapsed times fresh without a full re-render
      var nodes = body.querySelectorAll(".session-meta span:last-child");
      for (var i = 0; i < nodes.length; i += 1) {
        // relative times are refreshed by the next server update; nothing to do here
      }
    }
  }, 5000);

  renderUsage();

  if (!KEY) {
    $("contentBody").innerHTML = '<div class="empty">缺少访问密钥（k）。请使用 DSH 自动打开的链接，或重新打开带 k 的地址。</div>';
    setConnected(false);
    return;
  }

  connect();
})();
</script>

    wink: ["被你发现了。", "偶尔也可以不认真。", "嘿。"],
    love: ["你这么说，我会当真。", "有点心动。", "偷偷记下来了。"],
    confused: ["我好像没跟上。", "这里有点绕。", "让我重新理一遍。"],
    excited: ["这个可以。", "有点想马上试试。", "好，开工。"],
    dizzy: ["信息量有点大。", "转不过来了。", "让我原地缓缓。"],
    ambient: ["你忙你的，我在这儿。", "需要的时候看我一眼。", "我在等下一句话。", "安静一会儿也挺好。", "光标停了好久了。", "不着急，慢慢来。", "我先发会儿呆。"]
  };

  var SIZE = 1.5;
  var lastLine = "";

  function pickLine(pool, avoid) {
    if (!pool || pool.length === 0) return "";
    var index = Math.floor(Math.random() * pool.length);
    if (pool.length > 1 && pool[index] === avoid) index = (index + 1) % pool.length;
    return pool[index];
  }

  function showLine(text) {
    if (!text || text === lastLine || lineEl === null) return;
    lastLine = text;
    lineEl.innerHTML = "";
    var span = document.createElement("span");
    span.className = "pet-line-text";
    span.textContent = text;
    lineEl.appendChild(span);
  }

  var engine = {
    mood: "curious",
    target: MOODS.curious,
    eyes: [
      { cur: { x: 0, y: 0, rot: 0, sx: 1, sy: 1 }, vel: { x: 0, y: 0, rot: 0, sx: 0, sy: 0 }, lid: 0, lidTarget: 0 },
      { cur: { x: 0, y: 0, rot: 0, sx: 1, sy: 1 }, vel: { x: 0, y: 0, rot: 0, sx: 0, sy: 0 }, lid: 0, lidTarget: 0 }
    ],
    face: { cur: { x: 0, rot: 0, turn: 0 }, vel: { x: 0, rot: 0, turn: 0 } },
    gaze: { x: 0, y: 0, tx: 0, ty: 0 },
    pointer: { x: 0, y: 0 },
    blink: 0,
    blinkTarget: 0,
    nextGaze: 0,
    nextBlink: 0,
    nextIdleMood: 0
  };

  function spring(cur, vel, target, dt, k, d) {
    for (var key in target) {
      if (!Object.prototype.hasOwnProperty.call(target, key)) continue;
      if (!Object.prototype.hasOwnProperty.call(cur, key)) continue;
      var v = vel[key] || 0;
      var a = (target[key] - cur[key]) * k - v * d;
      vel[key] = v + a * dt;
      cur[key] += vel[key] * dt;
    }
  }

  var linked = false;
  var modelMood = "curious";
  var workStatus = "idle";

  function setAccessory(element, on) {
    if (element === null) return;
    element.classList.toggle("is-on", on === true);
  }

  function setMood(name) {
    var next = MOODS[name] || MOODS.neutral;
    if (engine.mood === name) return;
    engine.mood = name;
    engine.target = next;
    pet.style.setProperty("--pet-glow", next.color);
    pet.setAttribute("data-mood", name);
    if (moodLabel !== null) moodLabel.textContent = next.label;
    showLine(pickLine(MOOD_LINES[name] || MOOD_LINES.neutral, lastLine));
  }

  function setModelMood(name) {
    modelMood = MOODS[name] ? name : "neutral";
    var meta = STATUS[workStatus] || STATUS.idle;
    setMood(meta.mood || (modelMood === "focus" ? "neutral" : modelMood));
  }

  function setStatus(phase) {
    var meta = STATUS[phase] || STATUS.idle;
    workStatus = STATUS[phase] ? phase : "idle";
    if (statusText !== null) statusText.textContent = meta.label;
    pet.style.setProperty("--pet-status", meta.color);
    pet.setAttribute("data-status", workStatus);
    if (petCode !== null) petCode.hidden = meta.code !== true;
    setAccessory(petMagnifier, meta.magnifier);
    setAccessory(petThink, meta.dots);
    setAccessory(petCommand, meta.command);
    setAccessory(petError, meta.error);
    setAccessory(petWait, meta.wait);
    setMood(meta.mood || (modelMood === "focus" ? "neutral" : modelMood));
  }

  function readDshState() {
    try {
      var raw = localStorage.getItem("dsh-mood-eyes-state");
      if (!raw) return null;
      var value = JSON.parse(raw);
      return value && value.active === true ? value : null;
    } catch (error) {
      return null;
    }
  }

  function applyDshState() {
    var value = readDshState();
    if (value === null) return false;
    linked = true;
    if (caption !== null) caption.textContent = "由 DSH 同步";
    modelMood = MOODS[value.mood] ? value.mood : "neutral";
    setStatus(STATUS[value.status] ? value.status : "idle");
    return true;
  }

  function inferLocalStatus() {
    var conn = document.getElementById("connPill");
    if (conn !== null && conn.classList.contains("down")) return "error";
    var state = document.getElementById("selState");
    var text = state === null ? "" : state.textContent;
    if (text.indexOf("运行") >= 0 || text.indexOf("任务") >= 0) return "working";
    return "idle";
  }

  function pollPet() {
    if (testMode) return;
    if (applyDshState()) return;
    linked = false;
    if (caption !== null) caption.textContent = "本地状态";
    var phase = inferLocalStatus();
    if (phase === "idle" && Date.now() >= engine.nextIdleMood) {
      engine.nextIdleMood = Date.now() + 20000 + Math.random() * 22000;
      var pool = ["neutral", "curious", "happy", "sleepy"];
      setModelMood(pool[Math.floor(Math.random() * pool.length)]);
    }
    setStatus(phase);
  }

  function applyTestStep() {
    if (TEST_ITEMS.length === 0) return;
    var item = TEST_ITEMS[testIndex % TEST_ITEMS.length];
    testIndex += 1;
    if (item.mood) {
      setStatus("idle");
      setModelMood(item.mood);
    } else {
      setStatus(item.status);
    }
    if (caption !== null) caption.textContent = "测试模式";
  }

  function startTest() {
    testMode = true;
    testIndex = 0;
    if (testTimer !== null) window.clearInterval(testTimer);
    applyTestStep();
    testTimer = window.setInterval(applyTestStep, 1800);
  }

  function stopTest() {
    testMode = false;
    if (testTimer !== null) {
      window.clearInterval(testTimer);
      testTimer = null;
    }
    pollPet();
  }

  window.addEventListener("keydown", function (event) {
    if (event.key !== "t" && event.key !== "T") return;
    var element = document.activeElement;
    if (element !== null && /^(INPUT|TEXTAREA|SELECT)$/.test(element.tagName)) return;
    if (testMode) stopTest();
    else startTest();
  });

  function isPeakNow(date) {
    var now = date || new Date();
    var day = now.getUTCDay();
    if (day === 0 || day === 6) return false;
    var hour = now.getUTCHours();
    return (hour >= 1 && hour < 4) || (hour >= 6 && hour < 10);
  }

  function formatMoney(value, currency) {
    var number = Number(value);
    if (!Number.isFinite(number)) return "—";
    var symbol = currency === "CNY" ? "￥" : currency === "USD" ? "$" : currency ? currency + " " : "";
    return symbol + number.toFixed(2);
  }

  function updatePeak() {
    if (petPeak === null) return;
    var peak = isPeakNow();
    petPeak.textContent = peak ? "峰时" : "谷时";
    petPeak.classList.toggle("is-peak", peak);
    petPeak.classList.toggle("is-offpeak", !peak);
  }

  function updateUsageDom() {
    if (petBalance !== null && petBalance.textContent === "—") {
      var balance = document.getElementById("ucBalance");
      if (balance !== null && balance.textContent.trim() !== "—") petBalance.textContent = balance.textContent.trim();
    }
    if (petToday !== null && petToday.textContent === "—") {
      var todaySub = document.getElementById("ucTodaySub");
      if (todaySub !== null) {
        var text = todaySub.textContent.split("·")[0].trim();
        if (text) petToday.textContent = text;
      }
    }
  }

  function updateUsage() {
    updatePeak();
    if (petBalance !== null) {
      fetch("/api/mood-eyes/balance", { credentials: "same-origin", cache: "no-store" })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (value) {
          if (value && value.ok === true) petBalance.textContent = formatMoney(value.total, value.currency);
        })
        .catch(function () {});
    }
    if (petToday !== null) {
      fetch("/api/mood-eyes/usage", { credentials: "same-origin", cache: "no-store" })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (value) {
          if (value && value.ok === true && value.today && Number.isFinite(Number(value.today.costCny))) {
            petToday.textContent = formatMoney(value.today.costCny, "CNY");
          }
        })
        .catch(function () {});
    }
    setTimeout(updateUsageDom, 1200);
  }

  pet.style.setProperty("--pet-glow", MOODS.curious.color);
  pet.setAttribute("data-mood", "curious");
  if (moodLabel !== null) moodLabel.textContent = MOODS.curious.label;
  if (caption !== null) caption.textContent = "本地状态";
  showLine(pickLine(MOOD_LINES.curious, ""));

  var petDrag = document.getElementById("petDrag");
  var POS_KEY = "dsh-live-console-pet-position";
  var dragState = null;

  function clampPet(x, y) {
    var width = pet.offsetWidth || 210;
    var height = pet.offsetHeight || 180;
    return {
      x: Math.max(8, Math.min(x, Math.max(8, window.innerWidth - width - 8))),
      y: Math.max(8, Math.min(y, Math.max(8, window.innerHeight - height - 8)))
    };
  }

  function applyPetPosition(position) {
    if (!position || typeof position.x !== "number" || typeof position.y !== "number") return;
    var next = clampPet(position.x, position.y);
    pet.style.left = next.x + "px";
    pet.style.top = next.y + "px";
    pet.style.right = "auto";
    pet.style.bottom = "auto";
  }

  function readPetPosition() {
    try {
      var raw = localStorage.getItem(POS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      return null;
    }
  }

  applyPetPosition(readPetPosition());

  if (petDrag !== null) {
    petDrag.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse" && event.button !== 0) return;
      var rect = pet.getBoundingClientRect();
      dragState = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        left: rect.left,
        top: rect.top
      };
      pet.style.left = rect.left + "px";
      pet.style.top = rect.top + "px";
      pet.style.right = "auto";
      pet.style.bottom = "auto";
      event.preventDefault();
    });

    petDrag.addEventListener("dblclick", function (event) {
      event.preventDefault();
      dragState = null;
      try { localStorage.removeItem(POS_KEY); } catch (error) { /* ignore */ }
      pet.style.left = "";
      pet.style.top = "";
      pet.style.right = "";
      pet.style.bottom = "";
    });
  }

  window.addEventListener("pointermove", function (event) {
    if (dragState === null || event.pointerId !== dragState.pointerId) return;
    var next = clampPet(
      dragState.left + event.clientX - dragState.startX,
      dragState.top + event.clientY - dragState.startY
    );
    pet.style.left = next.x + "px";
    pet.style.top = next.y + "px";
  });

  window.addEventListener("pointerup", function (event) {
    if (dragState === null || event.pointerId !== dragState.pointerId) return;
    dragState = null;
    try {
      localStorage.setItem(POS_KEY, JSON.stringify({ x: pet.offsetLeft, y: pet.offsetTop }));
    } catch (error) { /* ignore */ }
  });

  window.addEventListener("resize", function () {
    if (pet.style.left) {
      var next = clampPet(pet.offsetLeft, pet.offsetTop);
      pet.style.left = next.x + "px";
      pet.style.top = next.y + "px";
    }
  });

  function scheduleAmbient() {
    window.setTimeout(function () {
      var conn = document.getElementById("connPill");
      var state = document.getElementById("selState");
      var text = state === null ? "" : state.textContent;
      var busy = workStatus !== "idle" || text.indexOf("运行") >= 0 || text.indexOf("任务") >= 0;
      var offline = conn !== null && conn.classList.contains("down");
      if (!testMode && !busy && !offline) showLine(pickLine(MOOD_LINES.ambient, lastLine));
      scheduleAmbient();
    }, 18000 + Math.random() * 20000);
  }
  scheduleAmbient();

  window.addEventListener("pointermove", function (event) {
    var rect = face.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    engine.pointer.x = Math.max(-1, Math.min(1, (event.clientX - (rect.left + rect.width / 2)) / 260));
    engine.pointer.y = Math.max(-1, Math.min(1, (event.clientY - (rect.top + rect.height / 2)) / 220));
  }, { passive: true });

  var last = performance.now();
  engine.nextBlink = last + 1800 + Math.random() * 1800;
  engine.nextGaze = last;

  function loop(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    var t = now / 1000;

    if (now >= engine.nextGaze) {
      engine.gaze.tx = (Math.random() * 2 - 1) * 2.6;
      engine.gaze.ty = (Math.random() * 2 - 1) * 1.8;
      engine.nextGaze = now + 900 + Math.random() * 1700;
    }
    var gazeEase = 1 - Math.exp(-dt * 18);
    engine.gaze.x += (engine.gaze.tx - engine.gaze.x) * gazeEase;
    engine.gaze.y += (engine.gaze.ty - engine.gaze.y) * gazeEase;

    if (now >= engine.nextBlink) {
      engine.blinkTarget = 1;
      setTimeout(function () {
        engine.blinkTarget = 0;
      }, 120);
      engine.nextBlink = now + 2600 + Math.random() * 2600;
    }
    engine.blink += (engine.blinkTarget - engine.blink) * (1 - Math.exp(-dt * 30));

    var px = engine.pointer.x;
    var py = engine.pointer.y;
    var faceTarget = {
      x: engine.target.lean * SIZE + px * 4.6 + Math.sin(t * 0.55) * 1.2,
      rot: engine.target.tilt + py * 3.2 + Math.sin(t * 0.55 + 0.6) * 0.6,
      turn: engine.target.turn + px * 9 + Math.sin(t * 0.55 + 1.1) * 1.6
    };
    spring(engine.face.cur, engine.face.vel, faceTarget, dt, 120, 15);

    var els = [eyeL, eyeR];
    for (var i = 0; i < 2; i += 1) {
      var eye = engine.eyes[i];
      var target = engine.target.eyes[i];
      var eyeTarget = {
        x: (target.x + engine.gaze.x) * SIZE + px * 5.8,
        y: (target.y + engine.gaze.y) * SIZE + py * 4.0,
        rot: target.rot,
        sx: target.sx,
        sy: target.sy
      };
      spring(eye.cur, eye.vel, eyeTarget, dt, 170, 18);
      eye.lid += (eye.lidTarget - eye.lid) * (1 - Math.exp(-dt * 28));
      if (Math.abs(eye.lidTarget - eye.lid) < 0.001) eye.lid = eye.lidTarget;
      var shut = Math.max(engine.blink, eye.lid);
      var sy = eye.cur.sy * (1 - 0.94 * shut);
      var sx = eye.cur.sx * (1 + (1 - sy) * 0.1);
      els[i].style.transform = "translate3d(" + eye.cur.x.toFixed(2) + "px, " + eye.cur.y.toFixed(2) + "px, 0) rotate(" + eye.cur.rot.toFixed(2) + "deg) scale(" + sx.toFixed(3) + ", " + sy.toFixed(3) + ")";
    }

    face.style.transform = "translate3d(" + engine.face.cur.x.toFixed(2) + "px, " + (Math.sin(t * 1.15) * 0.4).toFixed(2) + "px, 0) rotate(" + engine.face.cur.rot.toFixed(2) + "deg) rotateY(" + engine.face.cur.turn.toFixed(2) + "deg)";
    requestAnimationFrame(loop);
  }

  if (testMode) startTest();
  else pollPet();
  setInterval(function () {
    if (!testMode) pollPet();
  }, 1500);
  updateUsage();
  setInterval(updateUsage, 60000);
  setInterval(updateUsageDom, 2000);
  setInterval(updatePeak, 30000);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
